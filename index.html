<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>PBCLEAKZ • VOID ARCHIVE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      font-family: 'Inter', 'Helvetica Neue', 'SF Pro Display', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: rgba(180, 0, 0, 0.2);
      background-image: radial-gradient(rgba(25, 0, 0, 0.5) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      background-image: 
        linear-gradient(45deg, rgba(40,0,0,0.3) 1px, transparent 1px),
        linear-gradient(-45deg, rgba(30,0,0,0.25) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-glitch-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 3rem;
    }

    .intro-title {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 1000;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-transform: uppercase;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      text-shadow: 8px 8px 0 #4a0000, -6px -6px 0 #000000, 0 0 80px rgba(255,0,0,0.6);
      transform: skew(-5deg);
      line-height: 0.75;
      position: relative;
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 8px 8px 0 #4a0000, -6px -6px 0 #000000, 0 0 80px rgba(255,0,0,0.6); }
      50% { text-shadow: 8px 8px 0 #6a0000, -6px -6px 0 #000000, 0 0 120px rgba(255,0,0,0.9); }
    }

    .intro-title::after {
      content: 'PBCLEAKZ';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #ff0000;
      opacity: 0.2;
      transform: translate(8px, -5px);
      z-index: -1;
      text-shadow: 0 0 40px #ff0000;
      animation: glitchShift 0.3s infinite;
    }

    @keyframes glitchShift {
      0%, 100% { transform: translate(8px, -5px); opacity: 0.2; }
      50% { transform: translate(-6px, 3px); opacity: 0.3; }
    }

    .click-trigger {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 0.5rem;
      cursor: pointer;
    }

    .click-trigger:hover {
      transform: scale(1.08);
    }

    .open-button {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.6em;
      color: #aaaaaa;
      border: 2px solid rgba(220, 0, 0, 0.5);
      padding: 1.2rem 3.5rem;
      background: #0a0000;
      backdrop-filter: blur(30px);
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Inter', monospace;
      box-shadow: 0 0 50px rgba(220, 0, 0, 0.35), inset 0 0 20px rgba(200,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .open-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,0,0,0.2), transparent);
      transition: left 0.5s;
    }

    .click-trigger:hover .open-button::before {
      left: 100%;
    }

    .click-trigger:hover .open-button {
      background: #1a0000;
      border-color: #ff3333;
      color: #ffffff;
      box-shadow: 0 0 100px rgba(255, 0, 0, 0.8), inset 0 0 40px rgba(255,0,0,0.2);
      letter-spacing: 0.7em;
      text-shadow: 0 0 20px #ff0000;
      transform: translateY(-2px);
    }

    .hint-text {
      color: #660000;
      font-size: 0.85rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-top: 0.3rem;
      animation: hintPulse 2s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .main-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 800;
      background-image: 
        radial-gradient(circle at 25% 35%, rgba(80,0,0,0.35) 0%, transparent 50%),
        radial-gradient(circle at 75% 65%, rgba(60,0,0,0.3) 0%, transparent 50%);
    }

    .main-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .distortion-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(255,0,0,0.04) 0px, transparent 2px, rgba(0,0,0,0.9) 4px);
      pointer-events: none;
      z-index: 30;
    }

    .grid-texture {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(80,0,0,0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,0,0,0.15) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(circle at 50% 45%, black 20%, transparent 80%);
      pointer-events: none;
    }

    .content-center {
      position: relative;
      z-index: 60;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      animation: contentFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-leak {
      font-size: clamp(4rem, 18vw, 10rem);
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 3px #e0e0e0;
      background: linear-gradient(180deg, #ffffff 0%, #800000 85%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 60px #cc0000);
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      transform: skew(-4deg);
      line-height: 0.85;
      margin-bottom: 0.3rem;
      animation: brandGlow 2s ease-in-out infinite;
    }

    @keyframes brandGlow {
      0%, 100% { filter: drop-shadow(0 0 60px #cc0000); }
      50% { filter: drop-shadow(0 0 100px #ff0000); }
    }

    .sub-label {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.8em;
      color: #bbbbbb;
      text-transform: uppercase;
      border-bottom: 2px solid #660000;
      padding-bottom: 0.8rem;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(15px);
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .leak-tracks {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 2.2rem;
      margin: 2.2rem 0 2.8rem;
    }

    .track {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: #c0c0c0;
      text-transform: uppercase;
      padding: 0.5rem 1.8rem;
      border-left: 3px solid #770000;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: rgba(15, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      position: relative;
      cursor: pointer;
    }

    .track::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,0,0,0.1), transparent);
      transition: width 0.3s;
      z-index: -1;
    }

    .track:hover::before {
      width: 100%;
    }

    .track:hover {
      color: #ffffff;
      border-left: 4px solid #ff1a1a;
      text-shadow: 0 0 25px #ff0000;
      letter-spacing: 0.4em;
      background: rgba(35, 0, 0, 0.85);
      transform: translateX(8px) scale(1.05);
      box-shadow: 0 0 40px rgba(255,0,0,0.5);
    }

    .void-stamp {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: #660000;
      border: 2px solid #3a0000;
      padding: 0.6rem 2.5rem;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px);
      letter-spacing: 0.6em;
      transform: rotate(-1deg);
      font-weight: 600;
      transition: all 0.3s;
    }

    .void-stamp:hover {
      color: #990000;
      border-color: #660000;
      box-shadow: 0 0 30px rgba(200,0,0,0.3);
    }

    .footer-quote {
      color: #330000;
      margin-top: 2.2rem;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      font-style: italic;
    }

    .corner-signal {
      position: absolute;
      bottom: 20px;
      left: 25px;
      color: #3a0000;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      z-index: 70;
      transition: all 0.3s;
    }
    
    .corner-right {
      position: absolute;
      top: 22px;
      right: 28px;
      color: #440000;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      z-index: 70;
      transition: all 0.3s;
    }

    @media (max-width: 650px) {
      .leak-tracks {
        gap: 1.2rem;
      }
      .open-button {
        font-size: 1.2rem;
        padding: 0.9rem 2.2rem;
        letter-spacing: 0.4em;
      }
      .track {
        font-size: 0.9rem;
        padding: 0.4rem 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-glitch-container">
      <div class="intro-title">PBCLEAKZ</div>
    </div>
    <div class="click-trigger" id="enterButton">
      <div class="open-button">CLICK TO OPEN</div>
      <div class="hint-text">[ LEAK FREQUENCY ]</div>
    </div>
    <div style="color:#440000; margin-top: 3rem; font-size: 0.75rem; letter-spacing: 0.5em;">OPIUM • YVL • 555</div>
  </div>

  <div class="main-container" id="mainSite">
    <div class="grid-texture"></div>
    <div class="distortion-layer"></div>
    
    <div class="content-center">
      <div class="brand-leak">PBCLEAKZ</div>
      <div class="sub-label">DEEP VOID • UNRELEASED</div>
      
      <div class="leak-tracks">
        <span class="track">KETAMINE</span>
        <span class="track">HOMICIDE</span>
        <span class="track">POP OUT</span>
        <span class="track">UKGI</span>
        <span class="track">FOMDJ</span>
        <span class="track">KILLERS</span>
        <span class="track">MOON</span>
        <span class="track">EVIL</span>
      </div>
      
      <div class="void-stamp">▮ RESTRICTED ARCHIVE ▮</div>
      <div class="footer-quote">© PBCLEAKZ • 2026</div>
    </div>

    <div class="corner-signal">SIGNAL: VOID</div>
    <div class="corner-right">OPM 555</div>
  </div>

  <script>
    const intro = document.getElementById('introOverlay');
    const main = document.getElementById('mainSite');
    const enterBtn = document.getElementById('enterButton');

    const entranceMP3s = [
      'ENTRANCE/playboi-carti-what_lCCvSas.mp3',
      'ENTRANCE/seyuh-carti.mp3',
      'ENTRANCE/waeh-carti.mp3',
      'ENTRANCE/wake-up-filthy.mp3'
    ];

    let audioElement = null;
    let fadeInterval = null;
    let attemptCount = 0;
    const maxAttempts = 2;

    main.classList.remove('active');

    function getRandomMP3() {
      return entranceMP3s[Math.floor(Math.random() * entranceMP3s.length)];
    }

    function smoothFadeOut(duration = 2000) {
      if (!audioElement || audioElement.paused) return;
      
      if (fadeInterval) clearInterval(fadeInterval);
      
      const startVolume = audioElement.volume;
      const startTime = Date.now();
      
      fadeInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        audioElement.volume = startVolume * (1 - progress);
        
        if (progress >= 1) {
          clearInterval(fadeInterval);
          fadeInterval = null;
          audioElement.pause();
          audioElement.currentTime = 0;
          audioElement.volume = startVolume;
        }
      }, 50);
    }

    function playEntranceSound() {
      if (audioElement) {
        audioElement.pause();
        if (fadeInterval) clearInterval(fadeInterval);
        audioElement.remove();
        audioElement = null;
      }

      attemptCount = 0;
      tryPlayAudio();
    }

    function tryPlayAudio() {
      if (attemptCount >= maxAttempts) return;

      const randomFile = getRandomMP3();
      attemptCount++;
      
      audioElement = new Audio();
      audioElement.src = randomFile;
      audioElement.volume = 0.5;
      audioElement.preload = 'auto';

      audioElement.onloadeddata = () => {
        audioElement.currentTime = 0;
        audioElement.play().then(() => {
          setTimeout(() => smoothFadeOut(3000), 2000);
        }).catch(() => {});
      };

      audioElement.onerror = () => {
        if (attemptCount < maxAttempts) {
          setTimeout(() => tryPlayAudio(), 500);
        }
      };

      audioElement.load();
    }

    function revealArchive() {
      playEntranceSound();

      document.body.style.transition = 'background 0.2s';
      document.body.style.background = '#2a0000';
      setTimeout(() => {
        document.body.style.background = '#000000';
      }, 150);

      intro.classList.add('hidden');

      setTimeout(() => {
        main.classList.add('active');
        main.style.transition = 'opacity 0.5s ease, filter 0.5s';
        main.style.filter = 'blur(1px) contrast(1.1)';
        setTimeout(() => {
          main.style.filter = 'blur(0px) contrast(1)';
        }, 300);
      }, 200);

      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate([20, 50, 20]);
      }
    }

    enterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      revealArchive();
    });

    intro.addEventListener('click', (e) => {
      if (e.target === intro || e.target.classList.contains('intro-title') || e.target.classList.contains('hint-text')) {
        revealArchive();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !intro.classList.contains('hidden')) {
        e.preventDefault();
        revealArchive();
      }
    });

    const tracks = document.querySelectorAll('.track');
    tracks.forEach(track => {
      track.addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.style.transition = 'background 0.1s';
        document.body.style.background = '#2f0000';
        setTimeout(() => {
          document.body.style.background = '#000000';
        }, 80);
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(15);
        }
      });
    });
  </script>
</body>
</html>
