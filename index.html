<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>PBCLEAKZ •</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      font-family: 'Inter', 'Helvetica Neue', 'SF Pro Display', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: rgba(180, 0, 0, 0.2);
      background-image: radial-gradient(rgba(25, 0, 0, 0.4) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #ffffff;
    }

    .intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      background-image: 
        linear-gradient(45deg, rgba(40,0,0,0.3) 1px, transparent 1px),
        linear-gradient(-45deg, rgba(30,0,0,0.25) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-glitch-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 3rem;
    }

    .intro-title {
      font-size: clamp(4rem, 18vw, 10rem);
      font-weight: 1000;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-transform: uppercase;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      text-shadow: 8px 8px 0 #4a0000, -6px -6px 0 #000000, 0 0 80px rgba(255,0,0,0.6);
      transform: skew(-5deg);
      line-height: 0.75;
      position: relative;
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 8px 8px 0 #4a0000, -6px -6px 0 #000000, 0 0 80px rgba(255,0,0,0.6); }
      50% { text-shadow: 8px 8px 0 #6a0000, -6px -6px 0 #000000, 0 0 120px rgba(255,0,0,0.9); }
    }

    .intro-title::after {
      content: 'PBCLEAKZ';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #ff0000;
      opacity: 0.2;
      transform: translate(8px, -5px);
      z-index: -1;
      text-shadow: 0 0 40px #ff0000;
      animation: glitchShift 0.3s infinite;
    }

    @keyframes glitchShift {
      0%, 100% { transform: translate(8px, -5px); opacity: 0.2; }
      50% { transform: translate(-6px, 3px); opacity: 0.3; }
    }

    .click-trigger {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 0.5rem;
      cursor: pointer;
    }

    .click-trigger:hover {
      transform: scale(1.08);
    }

    .open-button {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.6em;
      color: #aaaaaa;
      border: 2px solid rgba(220, 0, 0, 0.5);
      padding: 1.2rem 3.5rem;
      background: #0a0000;
      backdrop-filter: blur(30px);
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Inter', monospace;
      box-shadow: 0 0 50px rgba(220, 0, 0, 0.35), inset 0 0 20px rgba(200,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .open-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,0,0,0.2), transparent);
      transition: left 0.5s;
    }

    .click-trigger:hover .open-button::before {
      left: 100%;
    }

    .click-trigger:hover .open-button {
      background: #1a0000;
      border-color: #ff3333;
      color: #ffffff;
      box-shadow: 0 0 100px rgba(255, 0, 0, 0.8), inset 0 0 40px rgba(255,0,0,0.2);
      letter-spacing: 0.7em;
      text-shadow: 0 0 20px #ff0000;
      transform: translateY(-2px);
    }

    .hint-text {
      color: #660000;
      font-size: 0.85rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-top: 0.3rem;
      animation: hintPulse 2s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .main-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 800;
      background-image: 
        radial-gradient(circle at 25% 35%, rgba(80,0,0,0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 65%, rgba(60,0,0,0.2) 0%, transparent 50%);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .main-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .main-container::-webkit-scrollbar {
      width: 4px;
    }

    .main-container::-webkit-scrollbar-track {
      background: #000000;
    }

    .main-container::-webkit-scrollbar-thumb {
      background: #330000;
      border-radius: 2px;
    }

    .distortion-layer {
      position: fixed;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(255,0,0,0.03) 0px, transparent 2px, rgba(0,0,0,0.9) 4px);
      pointer-events: none;
      z-index: 30;
    }

    .grid-texture {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(60,0,0,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60,0,0,0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 20;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1a0000;
    }

    .top-bar-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(200,0,0,0.6);
    }

    .back-button {
      background: none;
      border: 1px solid #440000;
      color: #888888;
      padding: 0.5rem 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      display: none;
    }

    .back-button:hover {
      border-color: #ff3333;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255,0,0,0.4);
    }

    .back-button.visible {
      display: block;
    }

    .content-area {
      position: relative;
      z-index: 60;
      padding: 2rem;
      flex: 1;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5em;
      color: #660000;
      text-transform: uppercase;
      margin-bottom: 2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #1a0000;
    }

    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
      animation: contentFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .album-card {
      background: rgba(10,0,0,0.6);
      border: 1px solid #1a0000;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .album-card:hover {
      border-color: #ff3333;
      background: rgba(20,0,0,0.8);
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(200,0,0,0.3);
    }

    .album-cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 2px solid #330000;
      background: #0a0000;
    }

    .album-name {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #cccccc;
      text-transform: uppercase;
    }

    .album-card:hover .album-name {
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255,0,0,0.6);
    }

    .tracklist-view {
      animation: contentFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tracklist-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #1a0000;
    }

    .tracklist-cover {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border: 2px solid #440000;
      box-shadow: 0 0 40px rgba(200,0,0,0.3);
    }

    .tracklist-info h2 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .tracklist-info p {
      color: #660000;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .track-items {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
      background: rgba(5,0,0,0.4);
      border-left: 3px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }

    .track-item:hover {
      background: rgba(20,0,0,0.6);
      border-left: 3px solid #ff3333;
      box-shadow: 0 0 20px rgba(200,0,0,0.2);
    }

    .track-item.playing {
      background: rgba(30,0,0,0.6);
      border-left: 3px solid #ff3333;
      box-shadow: 0 0 30px rgba(255,0,0,0.3);
    }

    .track-number {
      color: #440000;
      font-size: 0.9rem;
      font-weight: 700;
      width: 30px;
    }

    .track-item:hover .track-number,
    .track-item.playing .track-number {
      color: #ff3333;
    }

    .track-title {
      color: #cccccc;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      flex: 1;
    }

    .track-item:hover .track-title,
    .track-item.playing .track-title {
      color: #ffffff;
    }

    .track-duration {
      color: #440000;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }

    .track-item.playing .track-duration {
      color: #ff3333;
      animation: playIndicator 1s infinite;
    }

    @keyframes playIndicator {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .corner-signal {
      position: fixed;
      bottom: 20px;
      left: 25px;
      color: #2a0000;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      z-index: 70;
      pointer-events: none;
    }
    
    .corner-right {
      position: fixed;
      top: 22px;
      right: 28px;
      color: #330000;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      z-index: 70;
      pointer-events: none;
    }

    .hidden-section {
      display: none;
    }

    .visible-section {
      display: block;
    }

    @media (max-width: 768px) {
      .albums-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }
      .tracklist-header {
        flex-direction: column;
        text-align: center;
      }
      .tracklist-cover {
        width: 150px;
        height: 150px;
      }
      .top-bar-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-glitch-container">
      <div class="intro-title">PBCLEAKZ</div>
    </div>
    <div class="click-trigger" id="enterButton">
      <div class="open-button">CLICK TO OPEN</div>
      <div class="hint-text">[ LEAK FREQUENCY ]</div>
    </div>
    <div style="color:#440000; margin-top: 3rem; font-size: 0.75rem; letter-spacing: 0.5em;">OPIUM • YVL • 555</div>
  </div>

  <div class="main-container" id="mainSite">
    <div class="grid-texture"></div>
    <div class="distortion-layer"></div>
    
    <div class="top-bar">
      <span class="top-bar-title" id="topBarTitle">ARCHIVE</span>
      <button class="back-button" id="backButton" onclick="goBackToAlbums()">← BACK</button>
    </div>

    <div class="content-area">
      <div id="albumsSection" class="visible-section">
        <div class="section-title">▮ ALBUMS & PROJECTS</div>
        <div class="albums-grid" id="albumsGrid"></div>
      </div>
      
      <div id="tracklistSection" class="hidden-section">
        <div class="tracklist-view" id="tracklistContent"></div>
      </div>
    </div>

    <div class="corner-signal">SIGNAL: VOID</div>
    <div class="corner-right">OPM 555</div>
  </div>

  <script>
    const intro = document.getElementById('introOverlay');
    const main = document.getElementById('mainSite');
    const enterBtn = document.getElementById('enterButton');
    const albumsGrid = document.getElementById('albumsGrid');
    const tracklistContent = document.getElementById('tracklistContent');
    const albumsSection = document.getElementById('albumsSection');
    const tracklistSection = document.getElementById('tracklistSection');
    const backButton = document.getElementById('backButton');
    const topBarTitle = document.getElementById('topBarTitle');

    const entranceMP3s = [
      'ENTRANCE/playboi-carti-what_lCCvSas.mp3',
      'ENTRANCE/seyuh-carti.mp3',
      'ENTRANCE/waeh-carti.mp3',
      'ENTRANCE/wake-up-filthy.mp3'
    ];

    const albums = [
      {
        name: 'NARCISSIST',
        folder: 'NARCISSIST',
        cover: '/NARCISSIST/ALBUMICON.png',
        tracks: [
          { name: '24 Songs', file: '/NARCISSIST/24 Songs.mp3' },
          { name: 'Brand New', file: '/NARCISSIST/Brand New.mp3' },
          { name: 'GO', file: '/NARCISSIST/GO.mp3' },
          { name: 'HEARD YALL GETTIN MONEY', file: '/NARCISSIST/HEARD YALL GETTIN MONEY.mp3' },
          { name: 'Hold Up (feat. future)', file: '/NARCISSIST/Hold Up (feat. future).mp3' },
          { name: 'Killers', file: '/NARCISSIST/Killers.mp3' },
          { name: 'R.I.P D. Hill', file: '/NARCISSIST/R.I.P D. Hill.mp3' },
          { name: 'ROCKSTAR', file: '/NARCISSIST/ROCKSTAR.mp3' },
          { name: 'Sights', file: '/NARCISSIST/Sights.mp3' },
          { name: 'TWO OUT', file: '/NARCISSIST/TWO OUT.mp3' },
          { name: 'Tryna Get Down', file: '/NARCISSIST/Tryna Get Down.mp3' }
        ]
      }
    ];

    let audioElement = null;
    let fadeInterval = null;
    let currentTrackAudio = null;
    let currentPlayingIndex = -1;
    let currentAlbum = null;

    main.classList.remove('active');

    function getRandomMP3() {
      return entranceMP3s[Math.floor(Math.random() * entranceMP3s.length)];
    }

    function smoothFadeOut(duration = 2000) {
      if (!audioElement || audioElement.paused) return;
      if (fadeInterval) clearInterval(fadeInterval);
      const startVolume = audioElement.volume;
      const startTime = Date.now();
      fadeInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        audioElement.volume = startVolume * (1 - progress);
        if (progress >= 1) {
          clearInterval(fadeInterval);
          fadeInterval = null;
          audioElement.pause();
          audioElement.currentTime = 0;
          audioElement.volume = startVolume;
        }
      }, 50);
    }

    function playEntranceSound() {
      if (audioElement) {
        audioElement.pause();
        if (fadeInterval) clearInterval(fadeInterval);
        audioElement.remove();
        audioElement = null;
      }
      const randomFile = getRandomMP3();
      audioElement = new Audio();
      audioElement.src = randomFile;
      audioElement.volume = 0.5;
      audioElement.preload = 'auto';
      audioElement.onloadeddata = () => {
        audioElement.currentTime = 0;
        audioElement.play().then(() => {
          setTimeout(() => smoothFadeOut(3000), 2000);
        }).catch(() => {});
      };
      audioElement.onerror = () => {};
      audioElement.load();
    }

    function renderAlbums() {
      albumsGrid.innerHTML = '';
      albums.forEach(album => {
        const card = document.createElement('div');
        card.className = 'album-card';
        card.onclick = () => openAlbum(album);
        card.innerHTML = `
          <img class="album-cover" src="${album.cover}" alt="${album.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%230a0000%22 width=%22200%22 height=%22200%22/><text fill=%22%23440000%22 font-size=%2220%22 text-anchor=%22middle%22 x=%22100%22 y=%22110%22>${album.name}</text></svg>'">
          <div class="album-name">${album.name}</div>
        `;
        albumsGrid.appendChild(card);
      });
    }

    function openAlbum(album) {
      currentAlbum = album;
      currentPlayingIndex = -1;
      if (currentTrackAudio) {
        currentTrackAudio.pause();
        currentTrackAudio = null;
      }
      
      albumsSection.classList.remove('visible-section');
      albumsSection.classList.add('hidden-section');
      tracklistSection.classList.remove('hidden-section');
      tracklistSection.classList.add('visible-section');
      backButton.classList.add('visible');
      topBarTitle.textContent = album.name;

      tracklistContent.innerHTML = `
        <div class="tracklist-header">
          <img class="tracklist-cover" src="${album.cover}" alt="${album.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%230a0000%22 width=%22200%22 height=%22200%22/><text fill=%22%23440000%22 font-size=%2220%22 text-anchor=%22middle%22 x=%22100%22 y=%22110%22>${album.name}</text></svg>'">
          <div class="tracklist-info">
            <h2>${album.name}</h2>
            <p>${album.tracks.length} TRACKS</p>
          </div>
        </div>
        <div class="track-items">
          ${album.tracks.map((track, index) => `
            <div class="track-item" data-index="${index}" onclick="playTrack(${index}, event)">
              <span class="track-number">${String(index + 1).padStart(2, '0')}</span>
              <span class="track-title">${track.name}</span>
              <span class="track-duration" id="duration${index}">▶</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function goBackToAlbums() {
      if (currentTrackAudio) {
        currentTrackAudio.pause();
        currentTrackAudio = null;
      }
      currentPlayingIndex = -1;
      currentAlbum = null;
      tracklistSection.classList.remove('visible-section');
      tracklistSection.classList.add('hidden-section');
      albumsSection.classList.remove('hidden-section');
      albumsSection.classList.add('visible-section');
      backButton.classList.remove('visible');
      topBarTitle.textContent = 'ARCHIVE';
    }

    function playTrack(index, event) {
      if (!currentAlbum) return;
      
      const track = currentAlbum.tracks[index];
      
      if (currentTrackAudio) {
        currentTrackAudio.pause();
        currentTrackAudio = null;
      }
      
      document.querySelectorAll('.track-item').forEach(item => {
        item.classList.remove('playing');
        const durEl = item.querySelector('.track-duration');
        if (durEl) durEl.textContent = '▶';
      });
      
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('playing');
        const durEl = event.currentTarget.querySelector('.track-duration');
        if (durEl) durEl.textContent = '▶▶▶';
      }
      
      currentPlayingIndex = index;
      
      currentTrackAudio = new Audio();
      currentTrackAudio.src = track.file;
      currentTrackAudio.volume = 0.6;
      currentTrackAudio.play().catch(() => {});
      
      currentTrackAudio.onended = () => {
        if (currentAlbum && currentPlayingIndex < currentAlbum.tracks.length - 1) {
          const nextIndex = currentPlayingIndex + 1;
          const nextItem = document.querySelector(`.track-item[data-index="${nextIndex}"]`);
          playTrack(nextIndex, { currentTarget: nextItem });
        } else {
          document.querySelectorAll('.track-item').forEach(item => {
            item.classList.remove('playing');
            const durEl = item.querySelector('.track-duration');
            if (durEl) durEl.textContent = '▶';
          });
          currentPlayingIndex = -1;
        }
      };
    }

    function revealArchive() {
      playEntranceSound();
      document.body.style.transition = 'background 0.2s';
      document.body.style.background = '#2a0000';
      setTimeout(() => {
        document.body.style.background = '#000000';
      }, 150);
      intro.classList.add('hidden');
      setTimeout(() => {
        main.classList.add('active');
      }, 200);
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate([20, 50, 20]);
      }
    }

    enterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      revealArchive();
    });

    intro.addEventListener('click', (e) => {
      if (e.target === intro || e.target.classList.contains('intro-title') || e.target.classList.contains('hint-text')) {
        revealArchive();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !intro.classList.contains('hidden')) {
        e.preventDefault();
        revealArchive();
      }
    });

    renderAlbums();
  </script>
</body>
</html>
