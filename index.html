<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>PBC ⛧</title>
<style>
  :root{
    --void:#030102;
    --void-2:#080406;
    --void-3:#0e0709;
    --blood:#7a0c10;
    --blood-bright:#cc1218;
    --blood-glow:#ff2b32;
    --ash:#6b6262;
    --ash-dim:#342e2e;
    --ash-bright:#9e9494;
    --bone:#f0ebe8;
    --bone-dim:#d4cecb;
    --line:#1a0e10;
    --line-bright:#2e1418;
    --ok:#3ddc84;
    --gold:#b8944a;

    --radius-sm: 2px;
    --radius-md: 4px;
    --radius-lg: 8px;

    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --ease-smooth: cubic-bezier(.16,1,.3,1);
    --ease-out: cubic-bezier(.23,1,.32,1);

    --player-h: 128px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  html{
    -webkit-text-size-adjust:100%;
    color-scheme: dark;
  }

  body{
    background:var(--void);
    font-family:'Inter', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
    height:100vh; height:100dvh; width:100vw;
    overflow:hidden;
    color:var(--bone);
    -webkit-tap-highlight-color:transparent;
    font-feature-settings:"tnum" 1;
    letter-spacing:-0.01em;
  }

  ::selection{ background:var(--blood); color:var(--bone); }

  button{ font-family:inherit; letter-spacing:0.02em; }
  button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blood-bright);
    outline-offset:3px;
    border-radius:2px;
  }

  img{ -webkit-user-drag:none; user-select:none; }

  /* INTRO - Brutalist minimal */
  .intro-overlay{
    position:fixed; inset:0; z-index:999;
    background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .8s var(--ease-smooth), visibility .8s;
  }
  .intro-overlay::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      linear-gradient(0deg, rgba(138,14,18,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(138,14,18,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 45%, black 30%, transparent 70%);
  }
  .intro-overlay::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 35%, rgba(138,14,18,.08), transparent 50%);
    pointer-events:none;
  }
  .intro-overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .mark{
    width:28px; height:28px;
    margin-bottom:2.8rem;
    opacity:.7;
    animation:markSpin 20s linear infinite;
    position:relative; z-index:2;
  }
  @keyframes markSpin{ to{ transform:rotate(360deg); } }

  .intro-title{
    font-size:clamp(3rem,12vw,6.5rem);
    font-weight:900;
    letter-spacing:-0.04em;
    color:var(--bone);
    text-transform:uppercase;
    line-height:.78;
    position:relative; z-index:2;
    text-align:center;
    user-select:none;
  }
  .intro-title span{
    display:block;
    background:linear-gradient(180deg, var(--bone) 50%, var(--blood) 200%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sigil{
    font-size:.35em; vertical-align:.15em; margin-left:.1em;
    -webkit-text-fill-color:var(--blood-bright); color:var(--blood-bright);
    display:inline-block; animation:sigilFlicker 4s ease-in-out infinite;
  }
  @keyframes sigilFlicker{
    0%,85%,100%{ opacity:1; }
    88%{ opacity:.15; }
    90%{ opacity:1; }
    93%{ opacity:.25; }
  }

  .click-trigger{
    display:flex; flex-direction:column; align-items:center; gap:.8rem;
    margin-top:3.5rem;
    cursor:pointer;
    background:none; border:none; color:inherit;
    padding:.5rem;
    position:relative; z-index:2;
  }

  .open-button{
    font-size:.8rem;
    font-weight:700;
    letter-spacing:.35em;
    color:var(--bone);
    border:1px solid var(--blood);
    padding:.9rem 2.4rem;
    text-transform:uppercase;
    transition:all .35s var(--ease-spring);
    position:relative;
    overflow:hidden;
    background:rgba(138,14,18,0.05);
  }
  .open-button::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(204,18,24,.25), transparent);
    transform:translateX(-100%);
    transition:transform .5s var(--ease-smooth);
  }
  .click-trigger:hover .open-button::before,
  .click-trigger:focus-visible .open-button::before{ transform:translateX(100%); }
  .click-trigger:hover .open-button,
  .click-trigger:focus-visible .open-button{
    background:var(--blood);
    border-color:var(--blood-bright);
    box-shadow:0 0 50px rgba(204,18,24,.4);
    letter-spacing:.42em;
  }
  .click-trigger:active .open-button{ transform:scale(.96); }

  .hint-text{
    color:var(--ash-dim);
    font-size:.62rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    opacity:.7;
  }

  .intro-footer{
    position:absolute; bottom:2.2rem;
    color:var(--ash-dim);
    font-size:.6rem; letter-spacing:.35em;
    text-transform:uppercase;
    z-index:2;
    opacity:.6;
  }

  .audio-permission-note{
    position:absolute; bottom:5rem;
    color:var(--ash-dim);
    font-size:.58rem; letter-spacing:.15em;
    max-width:260px; text-align:center;
    line-height:1.7;
    opacity:0;
    transition:opacity .3s;
    z-index:2;
  }
  .audio-permission-note.show{ opacity:1; }

  /* MAIN LAYOUT */
  .main-container{
    position:fixed; inset:0;
    background:var(--void);
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity .5s var(--ease-out);
    z-index:800;
    overflow-y:auto; overflow-x:hidden;
  }
  .main-container.active{ opacity:1; pointer-events:auto; }
  .main-container::-webkit-scrollbar{ width:3px; }
  .main-container::-webkit-scrollbar-track{ background:transparent; }
  .main-container::-webkit-scrollbar-thumb{ background:var(--line-bright); border-radius:1px; }
  .main-container::-webkit-scrollbar-thumb:hover{ background:var(--blood); }

  /* Texture overlay */
  .grain{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    opacity:.25;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size:256px 256px;
  }
  .vignette{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%);
  }

  /* TOP BAR - Refined */
  .top-bar{
    position:sticky; top:0; z-index:100;
    background:rgba(3,1,2,.94);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    padding:1.1rem 1.5rem;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .top-bar-left{ display:flex; align-items:center; gap:.8rem; }
  .top-bar-title{
    font-size:.95rem; font-weight:800;
    letter-spacing:.25em;
    text-transform:uppercase;
    display:flex; align-items:center; gap:.4rem;
  }
  .top-bar-title .sigil-mini{ color:var(--blood-bright); font-size:.8em; opacity:.9; }

  .search-toggle{
    background:none; border:1px solid var(--line);
    color:var(--ash); width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .2s;
    border-radius:var(--radius-sm);
  }
  .search-toggle:hover{ border-color:var(--blood); color:var(--bone); }
  .search-toggle svg{ width:14px; height:14px; }

  .back-button{
    background:none; border:1px solid var(--line);
    color:var(--ash); padding:.4rem 1rem;
    font-size:.62rem; letter-spacing:.2em;
    text-transform:uppercase; cursor:pointer;
    transition:all .2s;
    opacity:0; pointer-events:none;
    display:flex; align-items:center; gap:.4rem;
    border-radius:var(--radius-sm);
  }
  .back-button.visible{ opacity:1; pointer-events:auto; }
  .back-button:hover{ border-color:var(--blood-bright); color:var(--bone); background:rgba(138,14,18,.06); }
  .back-button svg{ width:10px; height:10px; }

  .search-bar-wrap{
    max-height:0; overflow:hidden;
    transition:max-height .3s var(--ease-smooth);
    border-bottom:1px solid var(--line);
    background:var(--void-2);
  }
  .search-bar-wrap.open{ max-height:54px; }
  .search-input{
    width:100%; background:none; border:none; color:var(--bone);
    padding:.9rem 1.5rem; font-size:.8rem; letter-spacing:.03em;
    font-family:inherit;
  }
  .search-input::placeholder{ color:var(--ash-dim); letter-spacing:.12em; text-transform:uppercase; font-size:.68rem; }
  .search-input:focus{ outline:none; }

  .content-area{ position:relative; z-index:60; padding:1.5rem; flex:1; padding-bottom:calc(var(--player-h) + 2rem); }

  .section-title{
    font-size:.65rem; font-weight:700; letter-spacing:.35em;
    color:var(--ash-dim); text-transform:uppercase;
    margin-bottom:1.2rem; padding-bottom:.6rem;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-count{
    color:var(--ash-dim); font-size:.58rem; letter-spacing:.12em;
    font-weight:400;
  }

  /* ALBUM GRID - Editorial style */
  .albums-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:1rem;
    animation:fadeIn .4s var(--ease-smooth);
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .album-card{
    background:var(--void-2);
    border:1px solid var(--line);
    padding:.7rem;
    cursor:pointer;
    transition:border-color .2s, transform .25s var(--ease-spring), box-shadow .25s;
    text-align:left;
    border-radius:var(--radius-md);
    position:relative;
    overflow:hidden;
  }
  .album-card::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(204,18,24,.06), transparent 50%);
    opacity:0; transition:opacity .3s;
    pointer-events:none;
  }
  .album-card:hover, .album-card:focus-visible{
    border-color:var(--blood);
    transform:translateY(-3px);
    box-shadow:0 12px 28px -8px rgba(0,0,0,.5), 0 0 0 1px rgba(204,18,24,.1);
  }
  .album-card:hover::after{ opacity:1; }

  .album-cover-wrap{
    width:100%; aspect-ratio:1;
    overflow:hidden;
    margin-bottom:.7rem;
    background:linear-gradient(150deg, #120608, #030102);
    border-radius:var(--radius-sm);
    position:relative;
  }
  .album-cover{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .4s var(--ease-out);
  }
  .album-card:hover .album-cover{ transform:scale(1.06); }

  .album-cover-play{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(3,1,2,.3);
    opacity:0; transition:opacity .2s;
  }
  .album-card:hover .album-cover-play{ opacity:1; }
  .album-cover-play svg{
    width:34px; height:34px;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.5));
  }

  .album-name{
    font-size:.75rem; font-weight:700; letter-spacing:.08em;
    color:var(--bone); text-transform:uppercase;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .album-meta{
    font-size:.58rem; color:var(--ash-dim); letter-spacing:.1em;
    margin-top:.25rem; text-transform:uppercase;
  }

  /* TRACKLIST - Spread layout */
  .tracklist-view{ animation:fadeIn .35s var(--ease-smooth); max-width:700px; margin:0 auto; }

  .tracklist-header{
    display:flex; align-items:flex-end; gap:1.4rem;
    margin-bottom:1.6rem; padding-bottom:1.6rem;
    border-bottom:1px solid var(--line);
  }
  .tracklist-cover{
    width:120px; height:120px; object-fit:cover;
    background:linear-gradient(150deg, #120608, #030102);
    border:1px solid var(--line);
    flex-shrink:0;
    border-radius:var(--radius-md);
    box-shadow:0 16px 32px -10px rgba(0,0,0,.6);
  }
  .tracklist-info{ flex:1; min-width:0; }
  .tracklist-eyebrow{
    color:var(--blood-bright); font-size:.58rem; letter-spacing:.3em;
    text-transform:uppercase; margin-bottom:.4rem; font-weight:700; opacity:.9;
  }
  .tracklist-info h2{
    font-size:1.45rem; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; margin-bottom:.35rem;
    line-height:1.08;
  }
  .tracklist-info p{
    color:var(--ash-dim); font-size:.65rem; letter-spacing:.2em; text-transform:uppercase;
  }
  .tracklist-actions{ display:flex; gap:.6rem; margin-top:.9rem; }
  .action-btn{
    background:none; border:1px solid var(--blood);
    color:var(--bone); padding:.45rem 1rem;
    font-size:.6rem; letter-spacing:.18em; text-transform:uppercase;
    cursor:pointer; transition:all .2s;
    display:flex; align-items:center; gap:.4rem;
    border-radius:var(--radius-sm);
  }
  .action-btn:hover{ background:var(--blood); box-shadow:0 0 20px rgba(204,18,24,.3); }
  .action-btn svg{ width:11px; height:11px; }

  .track-items{ display:flex; flex-direction:column; gap:1px; }

  .track-item{
    display:grid;
    grid-template-columns:28px 1fr auto;
    align-items:center; gap:.8rem;
    padding:.75rem .5rem;
    border-bottom:1px solid rgba(26,14,16,.5);
    cursor:pointer;
    transition:background .15s;
    border-radius:var(--radius-sm);
  }
  .track-item:hover, .track-item:focus-visible{ background:rgba(138,14,18,.06); }
  .track-item.playing{ background:rgba(138,14,18,.1); }
  .track-item.errored{ opacity:.35; cursor:not-allowed; }

  .track-number{
    color:var(--ash-dim); font-size:.7rem; font-weight:700;
    font-variant-numeric:tabular-nums; text-align:right;
  }
  .track-item.playing .track-number{ color:var(--blood-bright); }

  .track-title{
    color:var(--ash); font-size:.82rem; font-weight:500; letter-spacing:.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .track-item:hover .track-title, .track-item.playing .track-title{ color:var(--bone); }

  .track-status{
    font-size:.62rem; color:var(--ash-dim); letter-spacing:.08em;
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:.35rem;
  }

  .eq{ display:flex; gap:1.5px; align-items:flex-end; height:10px; }
  .eq span{ width:1.5px; background:var(--blood-bright); animation:eqBounce 0.8s ease-in-out infinite; border-radius:1px; }
  .eq span:nth-child(1){ height:35%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:.12s; }
  .eq span:nth-child(3){ height:55%; animation-delay:.24s; }
  @keyframes eqBounce{ 0%,100%{ transform:scaleY(.3); } 50%{ transform:scaleY(1); } }

  /* PLAYER BAR - Floating panel */
  .player-bar{
    position:fixed; left:.5rem; right:.5rem; bottom:.5rem; z-index:200;
    background:rgba(4,2,3,.96);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid var(--line);
    padding:.7rem 1.2rem calc(.7rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:.5rem;
    transform:translateY(calc(100% + .5rem));
    transition:transform .4s var(--ease-smooth);
    box-shadow:0 8px 32px rgba(0,0,0,.6);
    border-radius:var(--radius-lg);
  }
  .player-bar.show{ transform:translateY(0); }
  .player-bar::before{
    content:'';
    position:absolute; top:-1px; left:2rem; right:2rem; height:1px;
    background:linear-gradient(90deg, transparent, var(--blood-bright), transparent);
    opacity:.4;
  }

  .player-row{ display:flex; align-items:center; gap:.9rem; }

  .player-track-info{ flex:1; min-width:0; display:flex; align-items:center; gap:.7rem; }
  .player-cover-thumb{
    width:36px; height:36px; border-radius:var(--radius-sm);
    object-fit:cover; flex-shrink:0;
    background:linear-gradient(150deg, #120608, #030102);
    border:1px solid var(--line);
  }
  .player-track-text{ min-width:0; }
  .player-track-title{
    font-size:.72rem; font-weight:700; letter-spacing:.02em;
    color:var(--bone); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-album-name{
    font-size:.56rem; color:var(--ash-dim); letter-spacing:.15em; text-transform:uppercase;
    margin-top:.15rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .player-controls{ display:flex; align-items:center; gap:.25rem; flex-shrink:0; }

  .ctrl-btn{
    background:none; border:none; color:var(--bone);
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:opacity .15s, transform .12s, color .15s;
    opacity:.65;
    border-radius:50%;
    position:relative;
  }
  .ctrl-btn:hover{ opacity:1; }
  .ctrl-btn:active{ transform:scale(.88); }
  .ctrl-btn svg{ width:14px; height:14px; }
  .ctrl-btn.toggle-active{ color:var(--blood-bright); opacity:1; }
  .ctrl-btn.toggle-active::after{
    content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
    width:3px; height:3px; border-radius:50%; background:var(--blood-bright);
  }
  .ctrl-btn .repeat-one-badge{
    position:absolute; top:1px; right:1px;
    font-size:.45rem; font-weight:800; color:var(--blood-bright);
    background:var(--void); border-radius:50%; width:10px; height:10px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  .play-toggle{
    width:38px; height:38px;
    border:1px solid var(--blood);
    border-radius:50%;
    opacity:1;
    background:rgba(138,14,18,.1);
  }
  .play-toggle:hover{ background:var(--blood); box-shadow:0 0 20px rgba(204,18,24,.4); }
  .play-toggle svg{ width:15px; height:15px; }

  .progress-row{ display:flex; align-items:center; gap:.6rem; }
  .time{
    font-size:.58rem; color:var(--ash-dim); font-variant-numeric:tabular-nums;
    width:30px; flex-shrink:0;
    user-select:none;
  }
  .time.time-end{ text-align:right; }

  .volume-wrap{ display:none; align-items:center; gap:.5rem; position:relative; }
  @media (min-width:640px){ .volume-wrap{ display:flex; } }

  .volume-icon-btn{
    background:none; border:none; color:var(--ash);
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:color .15s;
    flex-shrink:0;
  }
  .volume-icon-btn:hover{ color:var(--bone); }
  .volume-icon-btn svg{ width:13px; height:13px; }

  .slider-track{
    position:relative;
    height:12px;
    display:flex; align-items:center;
    cursor:pointer;
    touch-action:none;
    flex:1;
  }
  .slider-track .slider-rail{
    position:absolute; left:0; right:0; top:50%;
    height:2px; transform:translateY(-50%);
    background:var(--line);
    border-radius:1px;
    overflow:visible;
    transition:height .12s;
  }
  .slider-track:hover .slider-rail, .slider-track.dragging .slider-rail{ height:4px; }

  .slider-fill{
    position:absolute; left:0; top:0; height:100%;
    background:var(--blood-bright);
    width:0%;
    border-radius:1px;
    pointer-events:none;
    box-shadow:0 0 6px rgba(204,18,24,.4);
  }
  .volume-track .slider-fill{ background:var(--ash-bright); box-shadow:none; }
  .volume-track.dragging .slider-fill, .volume-track:hover .slider-fill{ background:var(--blood-bright); box-shadow:0 0 6px rgba(204,18,24,.3); }

  .slider-thumb{
    position:absolute; top:50%; left:0%;
    width:9px; height:9px;
    background:var(--bone);
    border:2px solid var(--blood-bright);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    transition:transform .15s var(--ease-spring);
    pointer-events:none;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .slider-track:hover .slider-thumb,
  .slider-track:focus-visible .slider-thumb,
  .slider-track.dragging .slider-thumb{
    transform:translate(-50%,-50%) scale(1);
  }
  .slider-track.dragging .slider-thumb{
    transform:translate(-50%,-50%) scale(1.3);
  }

  .progress-track{ flex:1; }

  .volume-track-wrap{ width:72px; }
  .volume-track-wrap .slider-track{ width:100%; }

  .volume-percent{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--void-3); border:1px solid var(--line-bright);
    color:var(--bone); font-size:.55rem; font-weight:700;
    padding:.2rem .4rem; border-radius:var(--radius-sm);
    opacity:0; transition:opacity .12s;
    pointer-events:none; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .volume-wrap:hover .volume-percent,
  .volume-track.dragging + .volume-percent,
  .volume-track-wrap:has(.dragging) .volume-percent{ opacity:1; }

  /* TOASTS */
  .toast-stack{
    position:fixed; top:1.2rem; left:50%; transform:translateX(-50%);

  @keyframes toastIn{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(-4px); } }

<body>

    <div class="top-bar">

  <div class="player-bar" id="playerBar">

<script>
(function(){

  const ICON_VOL_HIGH = '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M15.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M18.5 5.5a9 9 0 010 13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>';

  const entranceMP3s = [

  const albums = [
    {

      tracks: [
        { name: '24 Songs', file: '/NARCISSIST/24 Songs.mp3' },

        { name: 'Killers', file: '/NARCISSIST/Killers.mp3' },

        { name: 'ROCKSTAR', file: '/NARCISSIST/ROCKSTAR.mp3' },

        { name: 'TWO OUT', file: '/NARCISSIST/TWO OUT.mp3' },

      ]
    },
    {

      tracks: [
        { name: 'FeFe (feat. Pollari)', file: '/CA$H CARTI [LOST FILES]/01. FeFe (feat. Pollari).mp3' },
        { name: 'In The Party (feat. Spade Guwop & Johnny Cinco)', file: '/CA$H CARTI [LOST FILES]/02. In The Party (feat. Spade Guwop & Johnny Cinco).mp3' },
        { name: 'Just A Dream (feat. ManMan Savage)', file: '/CA$H CARTI [LOST FILES]/03. Just A Dream (feat. ManMan Savage).mp3' },
        { name: 'No Pressure (feat. Rich The Kid)', file: '/CA$H CARTI [LOST FILES]/04. No Pressure (feat. Rich The Kid).mp3' },
        { name: 'LSD II (Wit Da Fanta) [feat. Cultie]', file: '/CA$H CARTI [LOST FILES]/05. LSD II (Wit Da Fanta) [feat. Cultie].mp3' },
        { name: 'Peepin (feat. Gucci Mane & 21 Savage)', file: '/CA$H CARTI [LOST FILES]/06. Peepin (feat. Gucci Mane & 21 Savage).mp3' },
        { name: 'Dumb Hoe (feat. Jace)', file: '/CA$H CARTI [LOST FILES]/07. Dumb Hoe (feat. Jace).mp3' },
        { name: 'Scope (feat. ManMan Savage & ReddSmash)', file: '/CA$H CARTI [LOST FILES]/08. Scope (feat. ManMan Savage & ReddSmash).mp3' },
        { name: 'Left Right (feat. Lil Uzi Vert)', file: '/CA$H CARTI [LOST FILES]/09. Left Right (feat. Lil Uzi Vert).mp3' },
        { name: 'Ohh (feat. JuiceDaSavage)', file: '/CA$H CARTI [LOST FILES]/10. Ohh (feat. JuiceDaSavage).mp3' },
        { name: 'Run It (feat. Lil Yachty)', file: '/CA$H CARTI [LOST FILES]/11. Run It (feat. Lil Yachty).mp3' },
        { name: 'Too Much Dope (feat. KEY!)', file: '/CA$H CARTI [LOST FILES]/12. Too Much Dope (feat. KEY!).mp3' },
        { name: 'Splur Gang (feat. UnoTheActivist & Thouxanbandfauni)', file: '/CA$H CARTI [LOST FILES]/13. Splur Gang (feat. UnoTheActivist & Thouxanbandfauni).mp3' },
        { name: 'On The Block (feat. Fredo Santana, Yung Gleesh, K$upreme & Lil Yachty)', file: '/CA$H CARTI [LOST FILES]/14. On The Block (feat. Fredo Santana, Yung Gleesh, K$upreme & Lil Yachty).mp3' },
        { name: 'Whole Thang (feat. UnoTheActivist & Maxo Kream)', file: '/CA$H CARTI [LOST FILES]/15. Whole Thang (feat. UnoTheActivist & Maxo Kream).mp3' },
        { name: 'What (feat. MADEINTYO, Lil Yachty & UnoTheActivist)', file: '/CA$H CARTI [LOST FILES]/16. What (feat. MADEINTYO, Lil Yachty & UnoTheActivist).mp3' },
        { name: 'Step (feat. Yung Gleesh)', file: '/CA$H CARTI [LOST FILES]/17. Step (feat. Yung Gleesh).mp3' }
      ]
    }
  ];

  const albumState = {};
  albums.forEach(record => { albumState[record.name] = record; });

  let entranceAudio = null;
  let fadeTimer = null;

  const player = new Audio();
  player.preload = 'metadata';
  player.volume = 0.6;

  let currentAlbum = null;
  let currentIndex = -1;
  let isSeeking = false;
  let lastNonZeroVolume = 0.6;
  let isMuted = false;
  let repeatMode = 'off';

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function coverFallback(name){
    return 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <rect fill="#080406" width="200" height="200"/>
        <text fill="#342e2e" font-family="Helvetica" font-size="13" font-weight="700"
          text-anchor="middle" x="100" y="102" letter-spacing="1.5">${name}</text>
      </svg>`
    );
  }

  function showToast(message){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = message;
    toastStack.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  function randomEntranceFile(){
    return entranceMP3s[Math.floor(Math.random() * entranceMP3s.length)];
  }

  function fadeOutAndStop(audio, duration){
    if (!audio || audio.paused) return;
    if (fadeTimer) clearInterval(fadeTimer);
    const start = audio.volume;
    const t0 = Date.now();
    fadeTimer = setInterval(() => {
      const p = Math.min((Date.now() - t0) / duration, 1);
      audio.volume = start * (1 - p);
      if (p >= 1){
        clearInterval(fadeTimer);
        fadeTimer = null;
        audio.pause();
        audio.currentTime = 0;
      }
    }, 50);
  }

  function playEntranceSound(){
    entranceAudio = new Audio(randomEntranceFile());
    entranceAudio.volume = 0.45;
    entranceAudio.play().then(() => {
      setTimeout(() => fadeOutAndStop(entranceAudio, 2500), 1600);
    }).catch(() => {
      audioNote.classList.add('show');
      setTimeout(() => audioNote.classList.remove('show'), 3500);
    });
  }

  function revealArchive(){
    playEntranceSound();
    intro.classList.add('hidden');
    setTimeout(() => main.classList.add('active'), 120);
    if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([12, 30, 12]);
  }

  enterBtn.addEventListener('click', (e) => { e.stopPropagation(); revealArchive(); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !intro.classList.contains('hidden') && document.activeElement !== enterBtn){
      revealArchive();
    }
  });

  function renderAlbums(filterText){
    albumsGrid.innerHTML = '';
    const q = (filterText || '').trim().toLowerCase();

    const visible = albums.filter(record => {
      if (!q) return true;
      if (record.name.toLowerCase().includes(q)) return true;
      return record.tracks.some(t => t.name.toLowerCase().includes(q));
    });

    albumCount.textContent = albums.length ? `${albums.length} release${albums.length === 1 ? '' : 's'}` : '';

    if (!albums.length){
      albumsGrid.innerHTML = '<div class="empty-state">No releases catalogued yet.</div>';
      return;
    }
    if (!visible.length){
      albumsGrid.innerHTML = `<div class="empty-state">No matches for "${escapeHtml(filterText)}".</div>`;
      return;
    }

    visible.forEach(record => {
      const card = document.createElement('div');
      card.className = 'album-card';
      card.dataset.name = record.name;
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', `Open ${record.name}`);
      card.innerHTML = `
        <div class="album-cover-wrap">
          <img class="album-cover" src="${record.cover}" alt="" loading="lazy"
               onerror="this.onerror=null;this.src='${coverFallback(record.name)}'">
          <div class="album-cover-play">
            <svg viewBox="0 0 24 24" fill="#f0ebe8"><circle cx="12" cy="12" r="10" fill="rgba(3,1,2,.5)" stroke="#cc1218" stroke-width=".8"/><path d="M9.5 7.5l8 4.5-8 4.5z"/></svg>
          </div>
        </div>
        <div class="album-name">${escapeHtml(record.name)}</div>
        <div class="album-meta">${record.tracks.length} track${record.tracks.length === 1 ? '' : 's'}</div>
      `;
      card.addEventListener('click', () => openAlbum(record.name));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openAlbum(record.name); } });
      albumsGrid.appendChild(card);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function openAlbum(albumName){
    const record = albumState[albumName];
    if (!record) return;

    albumsSection.classList.replace('visible-section','hidden-section');
    tracklistSection.classList.replace('hidden-section','visible-section');
    backButton.classList.add('visible');
    topBarTitle.innerHTML = `<span class="sigil-mini">⛧</span> ${escapeHtml(record.name)}`;
    main.scrollTo({ top: 0, behavior: 'auto' });

    renderTracklistBody(record);
  }

  function renderTracklistBody(record){
    tracklistContent.innerHTML = `
      <div class="tracklist-header">
        <img class="tracklist-cover" src="${record.cover}" alt=""
             onerror="this.onerror=null;this.src='${coverFallback(record.name)}'">
        <div class="tracklist-info">
          <div class="tracklist-eyebrow">Release</div>
          <h2>${escapeHtml(record.name)}</h2>
          <p>${record.tracks.length} tracks</p>
          <div class="tracklist-actions">
            <button class="action-btn" id="playAllBtn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Play all
            </button>
          </div>
        </div>
      </div>
      <div class="track-items" id="trackItems"></div>
    `;

    const trackItems = document.getElementById('trackItems');
    record.tracks.forEach((track, index) => {
      const row = document.createElement('div');
      row.className = 'track-item';
      row.dataset.index = index;
      row.tabIndex = 0;
      row.setAttribute('role','button');
      row.setAttribute('aria-label', `Play ${track.name}`);
      row.innerHTML = `
        <span class="track-number">${String(index + 1).padStart(2,'0')}</span>
        <span class="track-title">${escapeHtml(track.name)}</span>
        <span class="track-status">▶</span>
      `;
      row.addEventListener('click', () => loadAndPlay(record.name, index));
      row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); loadAndPlay(record.name, index); } });
      trackItems.appendChild(row);
    });

    document.getElementById('playAllBtn').addEventListener('click', () => {
      loadAndPlay(record.name, 0);
    });

    refreshTrackHighlight();
  }

  backButton.addEventListener('click', () => {
    tracklistSection.classList.replace('visible-section','hidden-section');
    albumsSection.classList.replace('hidden-section','visible-section');
    backButton.classList.remove('visible');
    topBarTitle.innerHTML = `<span class="sigil-mini">⛧</span> Archive`;
  });

  let searchOpen = false;
  searchToggle.addEventListener('click', () => {
    searchOpen = !searchOpen;
    searchBarWrap.classList.toggle('open', searchOpen);
    if (searchOpen){
      if (tracklistSection.classList.contains('visible-section')){
        backButton.click();
      }
      setTimeout(() => searchInput.focus(), 200);
    } else {
      searchInput.value = '';
      renderAlbums('');
    }
  });
  searchInput.addEventListener('input', () => renderAlbums(searchInput.value));
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ searchInput.value=''; renderAlbums(''); searchToggle.click(); }
  });

  function getCurrentRecord(){
    return currentAlbum ? albumState[currentAlbum] : null;
  }

  function loadAndPlay(albumName, index){
    const record = albumState[albumName];
    if (!record) return;
    const track = record.tracks[index];
    if (!track) return;

    currentAlbum = albumName;
    currentIndex = index;

    player.src = encodeURI(track.file);
    player.currentTime = 0;
    player.play().catch(() => {
      markRowErrored(index);
      showToast('Playback unavailable');
    });

    playerTrackTitle.textContent = track.name;
    playerAlbumName.textContent = record.name;
    playerCoverThumb.src = record.cover;
    playerCoverThumb.style.display = 'block';
    playerCoverThumb.onerror = function(){ this.onerror=null; this.src = coverFallback(record.name); };
    playerBar.classList.add('show');
    refreshTrackHighlight();
  }

  function markRowErrored(index){
    const row = document.querySelector(`.track-item[data-index="${index}"]`);
    if (row){
      row.classList.add('errored');
      const status = row.querySelector('.track-status');
      if (status) status.textContent = '✕';
    }
  }

  function refreshTrackHighlight(){
    document.querySelectorAll('.track-item').forEach(item => {
      const idx = Number(item.dataset.index);
      const isPlaying = currentAlbum && idx === currentIndex && getCurrentRecord() && albumsMatchCurrentView();
      item.classList.toggle('playing', !!isPlaying);
      const status = item.querySelector('.track-status');
      if (!status || item.classList.contains('errored')) return;
      status.innerHTML = isPlaying
        ? '<span class="eq"><span></span><span></span><span></span></span>'
        : '▶';
    });
  }

  function albumsMatchCurrentView(){
    const headerTitle = document.querySelector('.tracklist-info h2');
    return headerTitle && currentAlbum && headerTitle.textContent === currentAlbum;
  }

  function setPlayIcon(playing){
    playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    playToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  playToggle.addEventListener('click', () => {
    if (!player.src) return;
    if (player.paused) player.play().catch(()=>{});
    else player.pause();
  });

  function goToNext(){
    const record = getCurrentRecord();
    if (!record) return;

    if (repeatMode === 'one'){
      loadAndPlay(currentAlbum, currentIndex);
      return;
    }

    if (currentIndex < record.tracks.length - 1){
      loadAndPlay(currentAlbum, currentIndex + 1);
    } else if (repeatMode === 'all'){
      loadAndPlay(currentAlbum, 0);
    } else {
      currentIndex = -1;
      refreshTrackHighlight();
    }
  }

  function goToPrev(){
    const record = getCurrentRecord();
    if (!record) return;

    if (player.currentTime > 3){
      player.currentTime = 0;
      return;
    }

    if (currentIndex > 0){
      loadAndPlay(currentAlbum, currentIndex - 1);
    }
  }

  prevBtn.addEventListener('click', goToPrev);
  nextBtn.addEventListener('click', goToNext);

  player.addEventListener('play', () => setPlayIcon(true));
  player.addEventListener('pause', () => setPlayIcon(false));

  player.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
    setSliderVisual(progressFill, progressThumb, pct);
    progressTrack.setAttribute('aria-valuenow', Math.round(pct));
    timeCurrent.textContent = fmtTime(player.currentTime);
  });

  player.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = fmtTime(player.duration);
  });

  player.addEventListener('ended', goToNext);

  player.addEventListener('error', () => {
    if (currentIndex >= 0) markRowErrored(currentIndex);
    showToast('Track failed to load');
  });

  function updateRepeatUI(){
    repeatBtn.classList.toggle('toggle-active', repeatMode !== 'off');
    repeatOneBadge.style.display = repeatMode === 'one' ? 'flex' : 'none';
  }

  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
    updateRepeatUI();
    showToast(repeatMode === 'off' ? 'Repeat off' : repeatMode === 'all' ? 'Repeat all' : 'Repeat one');
  });

  updateRepeatUI();

  function setSliderVisual(fillEl, thumbEl, pct){
    const clamped = Math.min(100, Math.max(0, pct));
    fillEl.style.width = clamped + '%';
    thumbEl.style.left = clamped + '%';
  }

  function createDraggableSlider({ trackEl, fillEl, thumbEl, onChange, onDragStart, onDragEnd }){
    let dragging = false;

    function pctFromEvent(evt){
      const rect = trackEl.getBoundingClientRect();
      const x = (evt.clientX !== undefined) ? evt.clientX : (evt.touches && evt.touches[0].clientX);
      const pct = ((x - rect.left) / rect.width) * 100;
      return Math.min(100, Math.max(0, pct));
    }

    function begin(evt){
      dragging = true;
      trackEl.classList.add('dragging');
      if (trackEl.setPointerCapture && evt.pointerId !== undefined){
        try { trackEl.setPointerCapture(evt.pointerId); } catch(e){}
      }
      if (onDragStart) onDragStart();
      const pct = pctFromEvent(evt);
      setSliderVisual(fillEl, thumbEl, pct);
      onChange(pct, false);
      evt.preventDefault();
    }

    function move(evt){
      if (!dragging) return;
      const pct = pctFromEvent(evt);
      setSliderVisual(fillEl, thumbEl, pct);
      onChange(pct, false);
    }

    function end(evt){
      if (!dragging) return;
      dragging = false;
      trackEl.classList.remove('dragging');
      const pct = evt ? pctFromEvent(evt) : parseFloat(fillEl.style.width) || 0;
      onChange(pct, true);
      if (onDragEnd) onDragEnd();
    }

    trackEl.addEventListener('pointerdown', begin);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);

    trackEl.addEventListener('click', (evt) => {
      if (dragging) return;
      const pct = pctFromEvent(evt);
      setSliderVisual(fillEl, thumbEl, pct);
      onChange(pct, true);
    });

    return {
      isDragging: () => dragging,
      setPct: (pct) => setSliderVisual(fillEl, thumbEl, pct)
    };
  }

  const progressSlider = createDraggableSlider({
    trackEl: progressTrack,
    fillEl: progressFill,
    thumbEl: progressThumb,
    onDragStart: () => { isSeeking = true; },
    onDragEnd: () => { isSeeking = false; },
    onChange: (pct) => {
      if (player.duration){
        player.currentTime = (pct / 100) * player.duration;
        timeCurrent.textContent = fmtTime(player.currentTime);
      }
      progressTrack.setAttribute('aria-valuenow', Math.round(pct));
    }
  });

  progressTrack.addEventListener('keydown', (e) => {
    if (!player.duration) return;
    if (e.key === 'ArrowRight'){ player.currentTime = Math.min(player.duration, player.currentTime + 5); }
    if (e.key === 'ArrowLeft'){ player.currentTime = Math.max(0, player.currentTime - 5); }
  });

  function applyVolume(pct){
    const vol = Math.min(1, Math.max(0, pct / 100));
    player.volume = vol;
    isMuted = vol === 0;
    if (vol > 0) lastNonZeroVolume = vol;
    volumeTrack.setAttribute('aria-valuenow', Math.round(vol * 100));
    volumePercent.textContent = Math.round(vol * 100) + '%';
    updateVolumeIcon(vol);
  }

  const volumeSlider = createDraggableSlider({
    trackEl: volumeTrack,
    fillEl: volumeFill,
    thumbEl: volumeThumb,
    onChange: applyVolume
  });

  function updateVolumeIcon(vol){
    if (vol === 0) volumeIcon.innerHTML = ICON_VOL_MUTE;
    else if (vol < 0.5) volumeIcon.innerHTML = ICON_VOL_LOW;
    else volumeIcon.innerHTML = ICON_VOL_HIGH;
  }

  volumeTrack.addEventListener('keydown', (e) => {
    let pct = player.volume * 100;
    if (e.key === 'ArrowRight'){ pct = Math.min(100, pct + 10); applyVolume(pct); volumeSlider.setPct(pct); }
    if (e.key === 'ArrowLeft'){ pct = Math.max(0, pct - 10); applyVolume(pct); volumeSlider.setPct(pct); }
  });

  volumeIconBtn.addEventListener('click', () => {
    if (isMuted || player.volume === 0){
      const restore = lastNonZeroVolume || 0.6;
      applyVolume(restore * 100);
      volumeSlider.setPct(restore * 100);
    } else {
      lastNonZeroVolume = player.volume;
      applyVolume(0);
      volumeSlider.setPct(0);
    }
  });

  applyVolume(player.volume * 100);
  volumeSlider.setPct(player.volume * 100);

  window.addEventListener('keydown', (e) => {
    if (document.activeElement === searchInput) return;
    if (!main.classList.contains('active')) return;

    if (e.code === 'Space'){
      e.preventDefault();
      if (player.src) player.paused ? player.play().catch(()=>{}) : player.pause();
    }
    if (e.key === 'ArrowUp' && !e.shiftKey){
      e.preventDefault();
      const pct = Math.min(100, player.volume * 100 + 5);
      applyVolume(pct); volumeSlider.setPct(pct);
    }
    if (e.key === 'ArrowDown' && !e.shiftKey){
      e.preventDefault();
      const pct = Math.max(0, player.volume * 100 - 5);
      applyVolume(pct); volumeSlider.setPct(pct);
    }
    if (e.key.toLowerCase() === 'n') goToNext();
    if (e.key.toLowerCase() === 'p') goToPrev();
    if (e.key.toLowerCase() === 'r') repeatBtn.click();
  });

  renderAlbums('');
})();
</script>
</body>
</html>
