<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>PBC ⛧</title>
<style>
  :root{
    --void:#050203;
    --void-2:#0b0405;
    --void-3:#100608;
    --blood:#8a0e12;
    --blood-bright:#e0141a;
    --blood-glow:#ff2b32;
    --ash:#7a6f6f;
    --ash-dim:#3d3535;
    --ash-bright:#a89d9d;
    --bone:#e8e2df;
    --bone-dim:#c9c2bf;
    --line:#241012;
    --line-bright:#3a1418;
    --ok:#3ddc84;

    --radius-sm: 3px;
    --radius-md: 6px;
    --radius-lg: 10px;

    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --ease-smooth: cubic-bezier(.16,1,.3,1);
    --ease-out: cubic-bezier(.23,1,.32,1);

    --player-h: 128px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  html{
    -webkit-text-size-adjust:100%;
    color-scheme: dark;
  }

  body{
    background:var(--void);
    font-family:'Helvetica Neue',system-ui,-apple-system,sans-serif;
    height:100vh; height:100dvh; width:100vw;
    overflow:hidden;
    color:var(--bone);
    -webkit-tap-highlight-color:transparent;
    font-feature-settings:"tnum" 1;
  }

  ::selection{ background:var(--blood); color:var(--bone); }

  button{ font-family:inherit; }
  button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blood-bright);
    outline-offset:3px;
    border-radius:2px;
  }

  img{ -webkit-user-drag:none; user-select:none; }

  .intro-overlay{
    position:fixed; inset:0; z-index:999;
    background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .7s var(--ease-smooth), visibility .7s;
  }
  .intro-overlay::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(138,14,18,.05) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(25deg, rgba(138,14,18,.04) 0 1px, transparent 1px 130px);
  }
  .intro-overlay::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(138,14,18,.14), transparent 60%);
    pointer-events:none;
  }
  .intro-overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .mark{
    width:34px; height:34px;
    margin-bottom:2.2rem;
    opacity:.85;
    animation:markSpin 14s linear infinite;
    position:relative; z-index:2;
  }
  @keyframes markSpin{ to{ transform:rotate(360deg); } }

  .intro-title{
    font-size:clamp(3.2rem,15vw,7.5rem);
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--bone);
    text-transform:uppercase;
    line-height:.82;
    position:relative; z-index:2;
    text-align:center;
  }
  .intro-title span{
    display:block;
    background:linear-gradient(180deg, var(--bone) 55%, var(--blood) 230%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sigil{
    font-size:.4em; vertical-align:.12em; margin-left:.15em;
    -webkit-text-fill-color:var(--blood-bright); color:var(--blood-bright);
    display:inline-block; animation:sigilFlicker 3.6s ease-in-out infinite;
  }
  @keyframes sigilFlicker{
    0%,88%,100%{ opacity:1; }
    90%{ opacity:.2; }
    92%{ opacity:1; }
    94%{ opacity:.35; }
  }

  .click-trigger{
    display:flex; flex-direction:column; align-items:center; gap:1rem;
    margin-top:3rem;
    cursor:pointer;
    background:none; border:none; color:inherit;
    padding:.5rem;
    position:relative; z-index:2;
  }

  .open-button{
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.45em;
    color:var(--bone);
    border:1px solid var(--blood);
    padding:1rem 2.6rem;
    text-transform:uppercase;
    transition:all .3s var(--ease-spring);
    position:relative;
    overflow:hidden;
  }
  .open-button::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(224,20,26,.35), transparent);
    transform:translateX(-100%);
    transition:transform .6s var(--ease-smooth);
  }
  .click-trigger:hover .open-button::before,
  .click-trigger:focus-visible .open-button::before{ transform:translateX(100%); }
  .click-trigger:hover .open-button,
  .click-trigger:focus-visible .open-button{
    background:var(--blood);
    border-color:var(--blood-bright);
    box-shadow:0 0 40px rgba(224,20,26,.5);
    letter-spacing:.5em;
  }
  .click-trigger:active .open-button{ transform:scale(.97); }

  .hint-text{
    color:var(--ash-dim);
    font-size:.68rem;
    letter-spacing:.4em;
    text-transform:uppercase;
  }

  .intro-footer{
    position:absolute; bottom:2.5rem;
    color:var(--ash-dim);
    font-size:.65rem; letter-spacing:.4em;
    text-transform:uppercase;
    z-index:2;
  }

  .audio-permission-note{
    position:absolute; bottom:5.4rem;
    color:var(--ash-dim);
    font-size:.62rem; letter-spacing:.2em;
    max-width:280px; text-align:center;
    line-height:1.6;
    opacity:0;
    transition:opacity .3s;
    z-index:2;
  }
  .audio-permission-note.show{ opacity:1; }

  .main-container{
    position:fixed; inset:0;
    background:var(--void);
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity .6s var(--ease-out);
    z-index:800;
    overflow-y:auto; overflow-x:hidden;
  }
  .main-container.active{ opacity:1; pointer-events:auto; }
  .main-container::-webkit-scrollbar{ width:4px; }
  .main-container::-webkit-scrollbar-track{ background:var(--void); }
  .main-container::-webkit-scrollbar-thumb{ background:var(--line-bright); border-radius:2px; }
  .main-container::-webkit-scrollbar-thumb:hover{ background:var(--blood); }

  .grain{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .vignette{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  .top-bar{
    position:sticky; top:0; z-index:100;
    background:rgba(5,2,3,.92);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    padding:1.3rem 1.75rem;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .top-bar-left{ display:flex; align-items:center; gap:1rem; }
  .top-bar-title{
    font-size:1.05rem; font-weight:800;
    letter-spacing:.35em;
    text-transform:uppercase;
    display:flex; align-items:center; gap:.5rem;
  }
  .top-bar-title .sigil-mini{ color:var(--blood-bright); font-size:.85em; }

  .search-toggle{
    background:none; border:1px solid var(--line);
    color:var(--ash); width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .25s;
    border-radius:var(--radius-sm);
  }
  .search-toggle:hover{ border-color:var(--blood); color:var(--bone); }
  .search-toggle svg{ width:15px; height:15px; }

  .back-button{
    background:none; border:1px solid var(--line);
    color:var(--ash); padding:.5rem 1.2rem;
    font-size:.68rem; letter-spacing:.25em;
    text-transform:uppercase; cursor:pointer;
    transition:all .25s;
    opacity:0; pointer-events:none;
    display:flex; align-items:center; gap:.5rem;
    border-radius:var(--radius-sm);
  }
  .back-button.visible{ opacity:1; pointer-events:auto; }
  .back-button:hover{ border-color:var(--blood-bright); color:var(--bone); background:rgba(138,14,18,.08); }
  .back-button svg{ width:11px; height:11px; }

  .search-bar-wrap{
    max-height:0; overflow:hidden;
    transition:max-height .3s var(--ease-smooth);
    border-bottom:1px solid var(--line);
    background:var(--void-2);
  }
  .search-bar-wrap.open{ max-height:60px; }
  .search-input{
    width:100%; background:none; border:none; color:var(--bone);
    padding:1rem 1.75rem; font-size:.85rem; letter-spacing:.05em;
    font-family:inherit;
  }
  .search-input::placeholder{ color:var(--ash-dim); letter-spacing:.15em; text-transform:uppercase; font-size:.72rem; }
  .search-input:focus{ outline:none; }

  .content-area{ position:relative; z-index:60; padding:1.75rem; flex:1; padding-bottom:calc(var(--player-h) + 2rem); }

  .section-title{
    font-size:.72rem; font-weight:700; letter-spacing:.4em;
    color:var(--ash-dim); text-transform:uppercase;
    margin-bottom:1.5rem; padding-bottom:.7rem;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-count{
    color:var(--ash-dim); font-size:.62rem; letter-spacing:.15em;
    font-weight:400;
  }

  .albums-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:1.2rem;
    animation:fadeIn .5s var(--ease-smooth);
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .album-card{
    background:var(--void-2);
    border:1px solid var(--line);
    padding:.9rem;
    cursor:pointer;
    transition:border-color .25s, transform .3s var(--ease-spring), box-shadow .3s;
    text-align:left;
    border-radius:var(--radius-md);
    position:relative;
    overflow:hidden;
  }
  .album-card::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(224,20,26,.08), transparent 60%);
    opacity:0; transition:opacity .3s;
    pointer-events:none;
  }
  .album-card:hover, .album-card:focus-visible{
    border-color:var(--blood);
    transform:translateY(-4px);
    box-shadow:0 14px 30px -10px rgba(0,0,0,.6), 0 0 0 1px rgba(224,20,26,.15);
  }
  .album-card:hover::before{ opacity:1; }

  .album-cover-wrap{
    width:100%; aspect-ratio:1;
    overflow:hidden;
    margin-bottom:.85rem;
    background:linear-gradient(150deg, #150708, #050203);
    border-radius:var(--radius-sm);
    position:relative;
  }
  .album-cover{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s var(--ease-out);
  }
  .album-card:hover .album-cover{ transform:scale(1.08); }

  .album-cover-play{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,2,3,.35);
    opacity:0; transition:opacity .25s;
  }
  .album-card:hover .album-cover-play{ opacity:1; }
  .album-cover-play svg{
    width:38px; height:38px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));
  }

  .album-name{
    font-size:.82rem; font-weight:700; letter-spacing:.12em;
    color:var(--bone); text-transform:uppercase;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .album-meta{
    font-size:.62rem; color:var(--ash-dim); letter-spacing:.15em;
    margin-top:.3rem; text-transform:uppercase;
  }

  .tracklist-view{ animation:fadeIn .4s var(--ease-smooth); max-width:780px; margin:0 auto; }

  .tracklist-header{
    display:flex; align-items:flex-end; gap:1.6rem;
    margin-bottom:1.9rem; padding-bottom:1.9rem;
    border-bottom:1px solid var(--line);
  }
  .tracklist-cover{
    width:136px; height:136px; object-fit:cover;
    background:linear-gradient(150deg, #150708, #050203);
    border:1px solid var(--line);
    flex-shrink:0;
    border-radius:var(--radius-md);
    box-shadow:0 20px 40px -14px rgba(0,0,0,.65);
  }
  .tracklist-info{ flex:1; min-width:0; }
  .tracklist-eyebrow{
    color:var(--blood-bright); font-size:.62rem; letter-spacing:.35em;
    text-transform:uppercase; margin-bottom:.5rem; font-weight:700;
  }
  .tracklist-info h2{
    font-size:1.65rem; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; margin-bottom:.45rem;
    line-height:1.1;
  }
  .tracklist-info p{
    color:var(--ash-dim); font-size:.7rem; letter-spacing:.25em; text-transform:uppercase;
  }
  .tracklist-actions{ display:flex; gap:.7rem; margin-top:1rem; }
  .action-btn{
    background:none; border:1px solid var(--blood);
    color:var(--bone); padding:.55rem 1.2rem;
    font-size:.65rem; letter-spacing:.22em; text-transform:uppercase;
    cursor:pointer; transition:all .25s;
    display:flex; align-items:center; gap:.5rem;
    border-radius:var(--radius-sm);
  }
  .action-btn:hover{ background:var(--blood); box-shadow:0 0 24px rgba(224,20,26,.4); }
  .action-btn.secondary{ border-color:var(--line-bright); }
  .action-btn.secondary:hover{ background:var(--void-3); box-shadow:none; border-color:var(--ash); }
  .action-btn svg{ width:12px; height:12px; }
  .action-btn.active{ background:var(--blood); border-color:var(--blood-bright); }

  .track-items{ display:flex; flex-direction:column; }

  .track-item{
    display:grid;
    grid-template-columns:30px 1fr auto;
    align-items:center; gap:1rem;
    padding:.9rem .6rem;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .2s;
    border-radius:var(--radius-sm);
  }
  .track-item:hover, .track-item:focus-visible{ background:rgba(138,14,18,.08); }
  .track-item.playing{ background:rgba(138,14,18,.14); }
  .track-item.errored{ opacity:.4; cursor:not-allowed; }

  .track-number{
    color:var(--ash-dim); font-size:.78rem; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .track-item.playing .track-number{ color:var(--blood-bright); }

  .track-title{
    color:var(--ash); font-size:.9rem; font-weight:500; letter-spacing:.02em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .track-item:hover .track-title, .track-item.playing .track-title{ color:var(--bone); }

  .track-status{
    font-size:.68rem; color:var(--ash-dim); letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:.4rem;
  }

  .eq{ display:flex; gap:2px; align-items:flex-end; height:12px; }
  .eq span{ width:2px; background:var(--blood-bright); animation:eqBounce 0.9s ease-in-out infinite; }
  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:.15s; }
  .eq span:nth-child(3){ height:65%; animation-delay:.3s; }
  @keyframes eqBounce{ 0%,100%{ transform:scaleY(.4); } 50%{ transform:scaleY(1); } }

  .player-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:200;
    background:rgba(6,3,4,.97);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-top:1px solid var(--line);
    padding:.85rem 1.4rem calc(.85rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:.65rem;
    transform:translateY(100%);
    transition:transform .45s var(--ease-smooth);
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  .player-bar.show{ transform:translateY(0); }
  .player-bar::before{
    content:'';
    position:absolute; top:-1px; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--blood-bright), transparent);
    opacity:.5;
  }

  .player-row{ display:flex; align-items:center; gap:1.1rem; }

  .player-track-info{ flex:1; min-width:0; display:flex; align-items:center; gap:.8rem; }
  .player-cover-thumb{
    width:42px; height:42px; border-radius:var(--radius-sm);
    object-fit:cover; flex-shrink:0;
    background:linear-gradient(150deg, #150708, #050203);
    border:1px solid var(--line);
  }
  .player-track-text{ min-width:0; }
  .player-track-title{
    font-size:.8rem; font-weight:700; letter-spacing:.03em;
    color:var(--bone); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-album-name{
    font-size:.62rem; color:var(--ash-dim); letter-spacing:.2em; text-transform:uppercase;
    margin-top:.2rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .player-controls{ display:flex; align-items:center; gap:.4rem; flex-shrink:0; }

  .ctrl-btn{
    background:none; border:none; color:var(--bone);
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:opacity .2s, transform .15s, color .2s;
    opacity:.75;
    border-radius:50%;
    position:relative;
  }
  .ctrl-btn:hover{ opacity:1; }
  .ctrl-btn:active{ transform:scale(.9); }
  .ctrl-btn svg{ width:16px; height:16px; }
  .ctrl-btn.toggle-active{ color:var(--blood-bright); opacity:1; }
  .ctrl-btn.toggle-active::after{
    content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--blood-bright);
  }
  .ctrl-btn .repeat-one-badge{
    position:absolute; top:2px; right:2px;
    font-size:.5rem; font-weight:800; color:var(--blood-bright);
    background:var(--void); border-radius:50%; width:11px; height:11px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  .play-toggle{
    width:42px; height:42px;
    border:1px solid var(--blood);
    border-radius:50%;
    opacity:1;
  }
  .play-toggle:hover{ background:var(--blood); box-shadow:0 0 24px rgba(224,20,26,.55); }
  .play-toggle svg{ width:17px; height:17px; }

  .progress-row{ display:flex; align-items:center; gap:.8rem; }
  .time{
    font-size:.64rem; color:var(--ash-dim); font-variant-numeric:tabular-nums;
    width:36px; flex-shrink:0;
    user-select:none;
  }
  .time.time-end{ text-align:right; }

  .volume-wrap{ display:none; align-items:center; gap:.6rem; position:relative; }
  @media (min-width:640px){ .volume-wrap{ display:flex; } }

  .volume-icon-btn{
    background:none; border:none; color:var(--ash);
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:color .2s;
    flex-shrink:0;
  }
  .volume-icon-btn:hover{ color:var(--bone); }
  .volume-icon-btn svg{ width:15px; height:15px; }

  .slider-track{
    position:relative;
    height:14px;
    display:flex; align-items:center;
    cursor:pointer;
    touch-action:none;
    flex:1;
  }
  .slider-track .slider-rail{
    position:absolute; left:0; right:0; top:50%;
    height:3px; transform:translateY(-50%);
    background:var(--line);
    border-radius:2px;
    overflow:visible;
    transition:height .15s;
  }
  .slider-track:hover .slider-rail, .slider-track.dragging .slider-rail{ height:5px; }

  .slider-fill{
    position:absolute; left:0; top:0; height:100%;
    background:var(--blood-bright);
    width:0%;
    border-radius:2px;
    pointer-events:none;
    box-shadow:0 0 8px rgba(224,20,26,.5);
  }
  .volume-track .slider-fill{ background:var(--ash-bright); box-shadow:none; }
  .volume-track.dragging .slider-fill, .volume-track:hover .slider-fill{ background:var(--blood-bright); box-shadow:0 0 8px rgba(224,20,26,.4); }

  .slider-thumb{
    position:absolute; top:50%; left:0%;
    width:11px; height:11px;
    background:var(--bone);
    border:2px solid var(--blood-bright);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    transition:transform .18s var(--ease-spring);
    pointer-events:none;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .slider-track:hover .slider-thumb,
  .slider-track:focus-visible .slider-thumb,
  .slider-track.dragging .slider-thumb{
    transform:translate(-50%,-50%) scale(1);
  }
  .slider-track.dragging .slider-thumb{
    transform:translate(-50%,-50%) scale(1.35);
  }

  .progress-track{ flex:1; }

  .volume-track-wrap{ width:88px; }
  .volume-track-wrap .slider-track{ width:100%; }

  .volume-percent{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--void-3); border:1px solid var(--line-bright);
    color:var(--bone); font-size:.62rem; font-weight:700;
    padding:.25rem .5rem; border-radius:var(--radius-sm);
    opacity:0; transition:opacity .15s;
    pointer-events:none; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .volume-wrap:hover .volume-percent,
  .volume-track.dragging + .volume-percent,
  .volume-track-wrap:has(.dragging) .volume-percent{ opacity:1; }

  /* ---------------------------------------------------------
     TOASTS
     --------------------------------------------------------- */
  .toast-stack{
    position:fixed; top:1.4rem; left:50%; transform:translateX(-50%);
    z-index:900; display:flex; flex-direction:column; gap:.5rem;
    pointer-events:none;
    align-items:center;
    width:100%;
    max-width:340px;
  }
  .toast{
    background:rgba(10,4,5,.95);
    border:1px solid var(--line-bright);
    color:var(--bone-dim);
    font-size:.7rem; letter-spacing:.08em;
    padding:.65rem 1.1rem;
    border-radius:var(--radius-sm);

  // O(1) lookup by album name — same shape the player expects.

  let shuffleOn = false;

  let shuffleHistory = []; // stack of played indices, for shuffle-aware "prev"

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return `${m}:${s}`;

  // ---------------------------------------------------------
  // D. Toast helper
  // ---------------------------------------------------------
  function showToast(message){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = message;
    toastStack.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  // ---------------------------------------------------------
  // C. Intro / entrance sound
  // ---------------------------------------------------------
  function randomEntranceFile(){
    return entranceMP3s[Math.floor(Math.random() * entranceMP3s.length)];
  }

  function fadeOutAndStop(audio, duration){
    if (!audio || audio.paused) return;
    if (fadeTimer) clearInterval(fadeTimer);
    const start = audio.volume;
    const t0 = Date.now();
    fadeTimer = setInterval(() => {
      const p = Math.min((Date.now() - t0) / duration, 1);
      audio.volume = start * (1 - p);
      if (p >= 1){
        clearInterval(fadeTimer);
        fadeTimer = null;
        audio.pause();
        audio.currentTime = 0;
      }
    }, 50);
  }

  function playEntranceSound(){
    entranceAudio = new Audio(randomEntranceFile());
    entranceAudio.volume = 0.5;
    entranceAudio.play().then(() => {
      setTimeout(() => fadeOutAndStop(entranceAudio, 2500), 1800);
    }).catch(() => {
      audioNote.classList.add('show');
      setTimeout(() => audioNote.classList.remove('show'), 3500);
    });
  }

    playEntranceSound();
    intro.classList.add('hidden');
    setTimeout(() => main.classList.add('active'), 150);
    if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([15, 40, 15]);

    if (e.key === 'Enter' && !intro.classList.contains('hidden') && document.activeElement !== enterBtn){
      revealArchive();

  // ---------------------------------------------------------
  // E. Album browsing & rendering
  // ---------------------------------------------------------
  function renderAlbums(filterText){
    albumsGrid.innerHTML = '';
    const q = (filterText || '').trim().toLowerCase();

    const visible = albums.filter(record => {
      if (!q) return true;
      if (record.name.toLowerCase().includes(q)) return true;
      return record.tracks.some(t => t.name.toLowerCase().includes(q));
    });

    albumCount.textContent = albums.length ? `${albums.length} release${albums.length === 1 ? '' : 's'}` : '';

    if (!albums.length){
      albumsGrid.innerHTML = '<div class="empty-state">No releases catalogued yet.</div>';
      return;
    }
    if (!visible.length){
      albumsGrid.innerHTML = `<div class="empty-state">No matches for “${escapeHtml(filterText)}”.</div>`;
      return;
    }

    visible.forEach(record => {
      const card = document.createElement('div');
      card.className = 'album-card';
      card.dataset.name = record.name;
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', `Open ${record.name}`);
      card.innerHTML = `
        <div class="album-cover-wrap">
          <img class="album-cover" src="${record.cover}" alt="" loading="lazy"

      `;
      card.addEventListener('click', () => openAlbum(record.name));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openAlbum(record.name); } });
      albumsGrid.appendChild(card);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function openAlbum(albumName){
    const record = albumState[albumName];

        </div>

    record.tracks.forEach((track, index) => {

      row.dataset.index = index;

      trackItems.appendChild(row);
    });

      updateShuffleUI();
      loadAndPlay(record.name, 0);

    albumsSection.classList.replace('hidden-section','visible-section');
    backButton.classList.remove('visible');
    topBarTitle.innerHTML = `<span class="sigil-mini">⛧</span> Archive`;
  });

  // ---------------------------------------------------------
  // F. Search / filter
  // ---------------------------------------------------------
  let searchOpen = false;
  searchToggle.addEventListener('click', () => {
    searchOpen = !searchOpen;
    searchBarWrap.classList.toggle('open', searchOpen);
    if (searchOpen){
      // if we're inside a tracklist, searching should return us to the grid
      if (tracklistSection.classList.contains('visible-section')){
        backButton.click();
      }
      setTimeout(() => searchInput.focus(), 200);
    } else {
      searchInput.value = '';
      renderAlbums('');
    }
  });
  searchInput.addEventListener('input', () => renderAlbums(searchInput.value));
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ searchInput.value=''; renderAlbums(''); searchToggle.click(); }
  });

  // ---------------------------------------------------------
  // G. Playback engine
  // ---------------------------------------------------------
  function getCurrentRecord(){
    return currentAlbum ? albumState[currentAlbum] : null;
  }

  function loadAndPlay(albumName, index){
    const record = albumState[albumName];
    if (!record) return;
    const track = record.tracks[index];
    if (!track) return;

    // if switching albums while playing, reset shuffle history
    if (currentAlbum !== albumName) shuffleHistory = [];

    currentAlbum = albumName;
    currentIndex = index;
    if (shuffleOn && shuffleHistory[shuffleHistory.length - 1] !== index){
      shuffleHistory.push(index);
    }

    player.src = encodeURI(track.file);
    player.currentTime = 0;
    player.play().catch(() => {
      markRowErrored(index);
      showToast('Playback unavailable for this track');
    });

    playerTrackTitle.textContent = track.name;
    playerAlbumName.textContent = record.name;
    playerCoverThumb.src = record.cover;
    playerCoverThumb.style.display = 'block';
    playerCoverThumb.onerror = function(){ this.onerror=null; this.src = coverFallback(record.name); };
    playerBar.classList.add('show');
    refreshTrackHighlight();
  }

  function markRowErrored(index){
    const row = document.querySelector(`.track-item[data-index="${index}"]`);
    if (row){
      row.classList.add('errored');
      const status = row.querySelector('.track-status');
      if (status) status.textContent = '✕ unavailable';
    }
  }

  function refreshTrackHighlight(){
    document.querySelectorAll('.track-item').forEach(item => {
      const idx = Number(item.dataset.index);
      const isPlaying = currentAlbum && idx === currentIndex && getCurrentRecord() && albumsMatchCurrentView();
      item.classList.toggle('playing', !!isPlaying);
      const status = item.querySelector('.track-status');
      if (!status || item.classList.contains('errored')) return;
      status.innerHTML = isPlaying
        ? '<span class="eq"><span></span><span></span><span></span></span>'
        : '▶';
    });
  }

  // guards against false-highlighting tracks in a different album's DOM
  function albumsMatchCurrentView(){
    const headerTitle = document.querySelector('.tracklist-info h2');
    return headerTitle && currentAlbum && headerTitle.textContent === currentAlbum;
  }

  function setPlayIcon(playing){
    playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    playToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  playToggle.addEventListener('click', () => {
    if (!player.src) return;
    if (player.paused) player.play().catch(()=>{});
    else player.pause();
  });

  function goToNext(){
    const record = getCurrentRecord();
    if (!record) return;

    if (repeatMode === 'one'){
      loadAndPlay(currentAlbum, currentIndex);
      return;
    }

    if (shuffleOn){
      if (record.tracks.length <= 1) return;
      let nextIdx;
      do { nextIdx = Math.floor(Math.random() * record.tracks.length); }
      while (nextIdx === currentIndex);
      loadAndPlay(currentAlbum, nextIdx);
      return;
    }

    if (currentIndex < record.tracks.length - 1){
      loadAndPlay(currentAlbum, currentIndex + 1);
    } else if (repeatMode === 'all'){
      loadAndPlay(currentAlbum, 0);
    } else {
      currentIndex = -1;
      refreshTrackHighlight();
    }
  }

  function goToPrev(){
    const record = getCurrentRecord();
    if (!record) return;

    // if we're a few seconds into the track, restart it instead of going back
    if (player.currentTime > 3){
      player.currentTime = 0;
      return;
    }

    if (shuffleOn && shuffleHistory.length > 1){
      shuffleHistory.pop(); // discard current
      const prevIdx = shuffleHistory[shuffleHistory.length - 1];
      loadAndPlay(currentAlbum, prevIdx);
      return;
    }

    if (currentIndex > 0){
      loadAndPlay(currentAlbum, currentIndex - 1);
    }
  }

  prevBtn.addEventListener('click', goToPrev);
  nextBtn.addEventListener('click', goToNext);

  player.addEventListener('play', () => setPlayIcon(true));
  player.addEventListener('pause', () => setPlayIcon(false));

  player.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
    setSliderVisual(progressFill, progressThumb, pct);
    progressTrack.setAttribute('aria-valuenow', Math.round(pct));
    timeCurrent.textContent = fmtTime(player.currentTime);
  });

  player.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = fmtTime(player.duration);
  });

  player.addEventListener('ended', goToNext);

  player.addEventListener('error', () => {
    if (currentIndex >= 0) markRowErrored(currentIndex);
    showToast('Track failed to load');
  });

  // ---------------------------------------------------------
  // H. Shuffle & repeat modes
  // ---------------------------------------------------------
  function updateShuffleUI(){
    shuffleBtn.classList.toggle('toggle-active', shuffleOn);
    shuffleBtn.setAttribute('aria-pressed', String(shuffleOn));
  }
  function updateRepeatUI(){
    repeatBtn.classList.toggle('toggle-active', repeatMode !== 'off');
    repeatOneBadge.style.display = repeatMode === 'one' ? 'flex' : 'none';
  }

  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    if (shuffleOn) shuffleHistory = currentIndex >= 0 ? [currentIndex] : [];
    updateShuffleUI();
    showToast(shuffleOn ? 'Shuffle on' : 'Shuffle off');
  });

  repeatBtn.addEventListener('click', () => {
    // cycles: off -> all -> one -> off
    repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
    updateRepeatUI();
    showToast(repeatMode === 'off' ? 'Repeat off' : repeatMode === 'all' ? 'Repeat all' : 'Repeat one');
  });

  updateShuffleUI();
  updateRepeatUI();

  // ---------------------------------------------------------
  // I. Generic draggable slider controller
  // Handles both the progress bar and the volume bar with the
  // same pointer-capture logic, so dragging works with mouse,
  // touch, and pen input uniformly — and keeps working even if
  // the pointer moves outside the element bounds mid-drag.
  // ---------------------------------------------------------
  function setSliderVisual(fillEl, thumbEl, pct){
    const clamped = Math.min(100, Math.max(0, pct));
    fillEl.style.width = clamped + '%';
    thumbEl.style.left = clamped + '%';
  }

  function createDraggableSlider({ trackEl, fillEl, thumbEl, onChange, onDragStart, onDragEnd, getInitialPct }){
    let dragging = false;

    function pctFromEvent(evt){
      const rect = trackEl.getBoundingClientRect();
      const x = (evt.clientX !== undefined) ? evt.clientX : (evt.touches && evt.touches[0].clientX);
      const pct = ((x - rect.left) / rect.width) * 100;
      return Math.min(100, Math.max(0, pct));
    }

    function begin(evt){
      dragging = true;
      trackEl.classList.add('dragging');
      if (trackEl.setPointerCapture && evt.pointerId !== undefined){
        try { trackEl.setPointerCapture(evt.pointerId); } catch(e){}
      }
      if (onDragStart) onDragStart();
      const pct = pctFromEvent(evt);
      setSliderVisual(fillEl, thumbEl, pct);
      onChange(pct, false);
      evt.preventDefault();
    }

    function move(evt){
      if (!dragging) return;
      const pct = pctFromEvent(evt);
      setSliderVisual(fillEl, thumbEl, pct);
      onChange(pct, false);
    }

    function end(evt){
      if (!dragging) return;
      dragging = false;
      trackEl.classList.remove('dragging');
      const pct = evt ? pctFromEvent(evt) : parseFloat(fillEl.style.width) || 0;
      onChange(pct, true);
      if (onDragEnd) onDragEnd();
    }

    trackEl.addEventListener('pointerdown', begin);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);

    // click-to-jump when not dragging (covers non-pointer environments)
    trackEl.addEventListener('click', (evt) => {
      if (dragging) return;
      const pct = pctFromEvent(evt);
      setSliderVisual(fillEl, thumbEl, pct);
      onChange(pct, true);
    });

    return {
      isDragging: () => dragging,
      setPct: (pct) => setSliderVisual(fillEl, thumbEl, pct)
    };
  }

  // --- progress slider wiring ---
  const progressSlider = createDraggableSlider({
    trackEl: progressTrack,
    fillEl: progressFill,
    thumbEl: progressThumb,
    onDragStart: () => { isSeeking = true; },
    onDragEnd: () => { isSeeking = false; },
    onChange: (pct) => {
      if (player.duration){
        player.currentTime = (pct / 100) * player.duration;
        timeCurrent.textContent = fmtTime(player.currentTime);
      }
      progressTrack.setAttribute('aria-valuenow', Math.round(pct));
    }
  });

  progressTrack.addEventListener('keydown', (e) => {
    if (!player.duration) return;
    if (e.key === 'ArrowRight'){ player.currentTime = Math.min(player.duration, player.currentTime + 5); }
    if (e.key === 'ArrowLeft'){ player.currentTime = Math.max(0, player.currentTime - 5); }
  });

  // --- volume slider wiring ---
  function applyVolume(pct, commit){
    const vol = Math.min(1, Math.max(0, pct / 100));
    player.volume = vol;
    isMuted = vol === 0;
    if (vol > 0) lastNonZeroVolume = vol;
    volumeTrack.setAttribute('aria-valuenow', Math.round(vol * 100));
    volumePercent.textContent = Math.round(vol * 100) + '%';
    updateVolumeIcon(vol);
  }

  const volumeSlider = createDraggableSlider({
    trackEl: volumeTrack,
    fillEl: volumeFill,
    thumbEl: volumeThumb,
    onChange: applyVolume
  });

  function updateVolumeIcon(vol){
    if (vol === 0) volumeIcon.innerHTML = ICON_VOL_MUTE;
    else if (vol < 0.5) volumeIcon.innerHTML = ICON_VOL_LOW;
    else volumeIcon.innerHTML = ICON_VOL_HIGH;
  }

  volumeTrack.addEventListener('keydown', (e) => {
    let pct = player.volume * 100;
    if (e.key === 'ArrowRight'){ pct = Math.min(100, pct + 10); applyVolume(pct, true); volumeSlider.setPct(pct); }
    if (e.key === 'ArrowLeft'){ pct = Math.max(0, pct - 10); applyVolume(pct, true); volumeSlider.setPct(pct); }
  });

  volumeIconBtn.addEventListener('click', () => {
    if (isMuted || player.volume === 0){
      const restore = lastNonZeroVolume || 0.6;
      applyVolume(restore * 100, true);
      volumeSlider.setPct(restore * 100);
    } else {
      lastNonZeroVolume = player.volume;
      applyVolume(0, true);
      volumeSlider.setPct(0);
    }
  });

  // initialize volume UI to match the Audio element's starting volume
  applyVolume(player.volume * 100, true);
  volumeSlider.setPct(player.volume * 100);

  // ---------------------------------------------------------
  // J. Keyboard shortcuts (only when not typing in the search box)
  // ---------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    if (document.activeElement === searchInput) return;
    if (!main.classList.contains('active')) return;

    if (e.code === 'Space'){
      e.preventDefault();
      if (player.src) player.paused ? player.play().catch(()=>{}) : player.pause();
    }
    if (e.key === 'ArrowUp' && !e.shiftKey){
      e.preventDefault();
      const pct = Math.min(100, player.volume * 100 + 5);
      applyVolume(pct, true); volumeSlider.setPct(pct);
    }
    if (e.key === 'ArrowDown' && !e.shiftKey){
      e.preventDefault();
      const pct = Math.max(0, player.volume * 100 - 5);
      applyVolume(pct, true); volumeSlider.setPct(pct);
    }
    if (e.key.toLowerCase() === 'n') goToNext();
    if (e.key.toLowerCase() === 'p') goToPrev();
    if (e.key.toLowerCase() === 's') shuffleBtn.click();
    if (e.key.toLowerCase() === 'r') repeatBtn.click();
  });

  // ---------------------------------------------------------
  // K. Init
  // ---------------------------------------------------------
  renderAlbums('');
})();
</script>
</body>
</html>
