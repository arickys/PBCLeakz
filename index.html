<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>PBC ⛧</title>
<style>
  :root{
    --void:#050203;
    --void-2:#0b0405;
    --blood:#8a0e12;
    --blood-bright:#e0141a;
    --ash:#7a6f6f;
    --ash-dim:#3d3535;
    --bone:#e8e2df;
    --line:#241012;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  html{ -webkit-text-size-adjust:100%; }

  body{
    background:var(--void);
    font-family:'Helvetica Neue',system-ui,-apple-system,sans-serif;
    height:100vh; height:100dvh; width:100vw;
    overflow:hidden;
    color:var(--bone);
    -webkit-tap-highlight-color:transparent;
  }

  ::selection{ background:var(--blood); color:var(--bone); }

  button{ font-family:inherit; }
  button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blood-bright);
    outline-offset:3px;
  }

  /* ---------- intro ---------- */
  .intro-overlay{
    position:fixed; inset:0; z-index:999;
    background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .7s cubic-bezier(.16,1,.3,1), visibility .7s;
  }
  .intro-overlay::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(138,14,18,.05) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(25deg, rgba(138,14,18,.04) 0 1px, transparent 1px 130px);
  }
  .intro-overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .mark{
    width:34px; height:34px;
    margin-bottom:2.2rem;
    opacity:.85;
    animation:markSpin 14s linear infinite;
  }
  @keyframes markSpin{ to{ transform:rotate(360deg); } }

  .intro-title{
    font-size:clamp(3.2rem,15vw,7.5rem);
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--bone);
    text-transform:uppercase;
    line-height:.82;
    position:relative;
    text-align:center;
  }
  .intro-title span{
    display:block;
    background:linear-gradient(180deg, var(--bone) 55%, var(--blood) 230%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sigil{
    font-size:.4em; vertical-align:.12em; margin-left:.15em;
    -webkit-text-fill-color:var(--blood-bright); color:var(--blood-bright);
    display:inline-block; animation:sigilFlicker 3.6s ease-in-out infinite;
  }
  @keyframes sigilFlicker{
    0%,88%,100%{ opacity:1; }
    90%{ opacity:.2; }
    92%{ opacity:1; }
    94%{ opacity:.35; }
  }

  .click-trigger{
    display:flex; flex-direction:column; align-items:center; gap:1rem;
    margin-top:3rem;
    cursor:pointer;
    background:none; border:none; color:inherit;
    padding:.5rem;
  }

  .open-button{
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.45em;
    color:var(--bone);
    border:1px solid var(--blood);
    padding:1rem 2.6rem;
    text-transform:uppercase;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .click-trigger:hover .open-button,
  .click-trigger:focus-visible .open-button{
    background:var(--blood);
    border-color:var(--blood-bright);
    box-shadow:0 0 40px rgba(224,20,26,.5);
    letter-spacing:.5em;
  }
  .click-trigger:active .open-button{ transform:scale(.97); }

  .hint-text{
    color:var(--ash-dim);
    font-size:.68rem;
    letter-spacing:.4em;
    text-transform:uppercase;
  }

  .intro-footer{
    position:absolute; bottom:2.5rem;
    color:var(--ash-dim);
    font-size:.65rem; letter-spacing:.4em;
    text-transform:uppercase;
  }

  .audio-permission-note{
    position:absolute; bottom:5.4rem;
    color:var(--ash-dim);
    font-size:.62rem; letter-spacing:.2em;
    max-width:280px; text-align:center;
    line-height:1.6;
    opacity:0;
    transition:opacity .3s;
  }
  .audio-permission-note.show{ opacity:1; }

  /* ---------- main ---------- */
  .main-container{
    position:fixed; inset:0;
    background:var(--void);
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity .6s cubic-bezier(.23,1,.32,1);
    z-index:800;
    overflow-y:auto; overflow-x:hidden;
  }
  .main-container.active{ opacity:1; pointer-events:auto; }
  .main-container::-webkit-scrollbar{ width:3px; }
  .main-container::-webkit-scrollbar-track{ background:var(--void); }
  .main-container::-webkit-scrollbar-thumb{ background:var(--line); }

  .grain{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:3px 3px;
  }

  .top-bar{
    position:sticky; top:0; z-index:100;
    background:rgba(5,2,3,.92);
    backdrop-filter:blur(16px);
    padding:1.3rem 1.75rem;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .top-bar-title{
    font-size:1.05rem; font-weight:800;
    letter-spacing:.35em;
    text-transform:uppercase;
  }
  .back-button{
    background:none; border:1px solid var(--line);
    color:var(--ash); padding:.5rem 1.2rem;
    font-size:.68rem; letter-spacing:.25em;
    text-transform:uppercase; cursor:pointer;
    transition:all .25s;
    opacity:0; pointer-events:none;
  }
  .back-button.visible{ opacity:1; pointer-events:auto; }
  .back-button:hover{ border-color:var(--blood-bright); color:var(--bone); }

  .content-area{ position:relative; z-index:60; padding:1.75rem; flex:1; padding-bottom:7rem; }

  .section-title{
    font-size:.72rem; font-weight:700; letter-spacing:.4em;
    color:var(--ash-dim); text-transform:uppercase;
    margin-bottom:1.5rem; padding-bottom:.7rem;
    border-bottom:1px solid var(--line);
  }

  .albums-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:1.1rem;
    animation:fadeIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .album-card{
    background:var(--void-2);
    border:1px solid var(--line);
    padding:.85rem;
    cursor:pointer;
    transition:border-color .25s, transform .25s cubic-bezier(.34,1.56,.64,1);
    text-align:left;
  }
  .album-card:hover, .album-card:focus-visible{
    border-color:var(--blood);
    transform:translateY(-3px);
  }
  .album-cover{
    width:100%; aspect-ratio:1;
    object-fit:cover;
    margin-bottom:.75rem;
    background:linear-gradient(150deg, #150708, #050203);
    display:flex; align-items:center; justify-content:center;
  }
  .album-name{
    font-size:.82rem; font-weight:700; letter-spacing:.12em;
    color:var(--bone); text-transform:uppercase;
  }
  .album-meta{
    font-size:.62rem; color:var(--ash-dim); letter-spacing:.15em;
    margin-top:.3rem; text-transform:uppercase;
  }

  .tracklist-view{ animation:fadeIn .4s cubic-bezier(.16,1,.3,1); max-width:760px; margin:0 auto; }

  .tracklist-header{
    display:flex; align-items:flex-end; gap:1.5rem;
    margin-bottom:1.75rem; padding-bottom:1.75rem;
    border-bottom:1px solid var(--line);
  }
  .tracklist-cover{
    width:130px; height:130px; object-fit:cover;
    background:linear-gradient(150deg, #150708, #050203);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .tracklist-info h2{
    font-size:1.6rem; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:.4rem;
  }
  .tracklist-info p{
    color:var(--ash-dim); font-size:.7rem; letter-spacing:.25em; text-transform:uppercase;
  }
  .play-all-btn{
    margin-top:.9rem;
    background:none; border:1px solid var(--blood);
    color:var(--bone); padding:.5rem 1.1rem;
    font-size:.65rem; letter-spacing:.25em; text-transform:uppercase;
    cursor:pointer; transition:all .25s;
  }
  .play-all-btn:hover{ background:var(--blood); box-shadow:0 0 24px rgba(224,20,26,.4); }

  .track-items{ display:flex; flex-direction:column; }

  .track-item{
    display:grid;
    grid-template-columns:28px 1fr auto;
    align-items:center; gap:1rem;
    padding:.85rem .5rem;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .2s;
  }
  .track-item:hover, .track-item:focus-visible{ background:rgba(138,14,18,.08); }
  .track-item.playing{ background:rgba(138,14,18,.12); }
  .track-item.errored{ opacity:.4; cursor:not-allowed; }

  .track-number{
    color:var(--ash-dim); font-size:.78rem; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .track-item.playing .track-number{ color:var(--blood-bright); }

  .track-title{
    color:var(--ash); font-size:.9rem; font-weight:500; letter-spacing:.02em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .track-item:hover .track-title, .track-item.playing .track-title{ color:var(--bone); }

  .track-status{
    font-size:.68rem; color:var(--ash-dim); letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:.4rem;
  }

  .eq{ display:flex; gap:2px; align-items:flex-end; height:12px; }
  .eq span{ width:2px; background:var(--blood-bright); animation:eqBounce 0.9s ease-in-out infinite; }
  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:.15s; }
  .eq span:nth-child(3){ height:65%; animation-delay:.3s; }
  @keyframes eqBounce{ 0%,100%{ transform:scaleY(.4); } 50%{ transform:scaleY(1); } }

  /* ---------- player bar ---------- */
  .player-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:200;
    background:rgba(5,2,3,.96);
    backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    padding:.7rem 1.25rem calc(.7rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:.55rem;
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.16,1,.3,1);
  }
  .player-bar.show{ transform:translateY(0); }

  .player-row{ display:flex; align-items:center; gap:1rem; }

  .player-track-info{ flex:1; min-width:0; }
  .player-track-title{
    font-size:.78rem; font-weight:700; letter-spacing:.05em;
    color:var(--bone); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-album-name{
    font-size:.62rem; color:var(--ash-dim); letter-spacing:.2em; text-transform:uppercase;
    margin-top:.15rem;
  }

  .player-controls{ display:flex; align-items:center; gap:.6rem; flex-shrink:0; }

  .ctrl-btn{
    background:none; border:none; color:var(--bone);
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:opacity .2s;
    opacity:.8;
  }
  .ctrl-btn:hover{ opacity:1; }
  .ctrl-btn svg{ width:16px; height:16px; }

  .play-toggle{
    width:38px; height:38px;
    border:1px solid var(--blood);
    border-radius:50%;
  }
  .play-toggle:hover{ background:var(--blood); box-shadow:0 0 20px rgba(224,20,26,.5); }

  .progress-row{ display:flex; align-items:center; gap:.7rem; }
  .time{
    font-size:.62rem; color:var(--ash-dim); font-variant-numeric:tabular-nums;
    width:34px; flex-shrink:0;
  }
  .time.time-end{ text-align:right; }

  .progress-track{
    flex:1; height:3px; background:var(--line);
    position:relative; cursor:pointer;
    display:flex; align-items:center;
  }
  .progress-track:hover{ height:5px; }
  .progress-fill{
    position:absolute; left:0; top:0; height:100%;
    background:var(--blood-bright);
    width:0%;
    pointer-events:none;
  }

  .volume-wrap{ display:none; align-items:center; gap:.5rem; }
  @media (min-width:640px){ .volume-wrap{ display:flex; } }
  .volume-track{
    width:70px; height:3px; background:var(--line); cursor:pointer; position:relative;
  }
  .volume-fill{
    position:absolute; left:0; top:0; height:100%; background:var(--ash);
    width:60%; pointer-events:none;
  }

  .corner-signal{
    position:fixed; bottom:calc(1.1rem + 68px); left:1.25rem;
    color:var(--ash-dim); font-size:.6rem; letter-spacing:.25em;
    z-index:70; pointer-events:none;
  }
  .corner-right{
    position:fixed; top:1.4rem; right:1.6rem;
    color:var(--ash-dim); font-size:.6rem; letter-spacing:.3em;
    z-index:70; pointer-events:none;
  }
  @media (max-width:520px){ .corner-signal, .corner-right{ display:none; } }

  .hidden-section{ display:none; }
  .visible-section{ display:block; }

  .empty-state{
    color:var(--ash-dim); font-size:.75rem; letter-spacing:.15em;
    padding:2rem 0; text-align:center;
  }

  .error-state{
    color:var(--blood-bright); font-size:.72rem; letter-spacing:.1em;
    padding:1.5rem; text-align:center; line-height:1.7;
    border:1px dashed var(--blood); background:rgba(138,14,18,.06);
  }
  .error-state code{
    display:block; margin-top:.6rem; color:var(--ash);
    font-size:.68rem; letter-spacing:.02em; word-break:break-all;
  }

  @media (max-width:520px){
    .albums-grid{ grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:.8rem; }
    .tracklist-cover{ width:96px; height:96px; }
    .tracklist-info h2{ font-size:1.2rem; }
    .content-area{ padding:1.1rem; padding-bottom:7rem; }
    .player-track-title{ font-size:.72rem; }
  }
</style>
</head>
<body>

  <div class="intro-overlay" id="introOverlay">

      <path d="M12 1L12 23M1 12L23 12M4 4L20 20M20 4L4 20" stroke="#8a0e12" stroke-width="1"/>

      </div>
      <div class="volume-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--ash)" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        <div class="volume-track" id="volumeTrack" role="slider" aria-label="Volume" tabindex="0"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
          <div class="volume-fill" id="volumeFill"></div>
        </div>
      </div>
    </div>

        { name: 'Scope (feat. ManMan Savage & ReddSmash)', file: '/CA$H CARTI [LOST FILES]/08. Scope (feat. ManMan Savage & ReddSmash).mp3' },
        { name: 'Left Right (feat. Lil Uzi Vert)', file: '/CA$H CARTI [LOST FILES]/09. Left Right (feat. Lil Uzi Vert).mp3' },
        { name: 'Ohh (feat. JuiceDaSavage)', file: '/CA$H CARTI [LOST FILES]/10. Ohh (feat. JuiceDaSavage).mp3' },
        { name: 'Run It (feat. Lil Yachty)', file: '/CA$H CARTI [LOST FILES]/11. Run It (feat. Lil Yachty).mp3' },
        { name: 'Too Much Dope (feat. KEY!)', file: '/CA$H CARTI [LOST FILES]/12. Too Much Dope (feat. KEY!).mp3' },
        { name: 'Splur Gang (feat. UnoTheActivist & Thouxanbandfauni)', file: '/CA$H CARTI [LOST FILES]/13. Splur Gang (feat. UnoTheActivist & Thouxanbandfauni).mp3' },
        { name: 'On The Block (feat. Fredo Santana, Yung Gleesh, K$upreme & Lil Yachty)', file: '/CA$H CARTI [LOST FILES]/14. On The Block (feat. Fredo Santana, Yung Gleesh, K$upreme & Lil Yachty).mp3' },
        { name: 'Whole Thang (feat. UnoTheActivist & Maxo Kream)', file: '/CA$H CARTI [LOST FILES]/15. Whole Thang (feat. UnoTheActivist & Maxo Kream).mp3' },
        { name: 'What (feat. MADEINTYO, Lil Yachty & UnoTheActivist)', file: '/CA$H CARTI [LOST FILES]/16. What (feat. MADEINTYO, Lil Yachty & UnoTheActivist).mp3' },
        { name: 'Step (feat. Yung Gleesh)', file: '/CA$H CARTI [LOST FILES]/17. Step (feat. Yung Gleesh).mp3' }
      ]
    }
  ];

  // In-memory cache keyed by album name, so lookups by name are O(1)
  // and the rest of the player code (loadAndPlay/next/prev/ended) can
  // just do albumState[currentAlbum] the same way it did before.
  const albumState = {};
  albums.forEach(record => { albumState[record.name] = record; });

  let entranceAudio = null;
  let fadeTimer = null;

  const player = new Audio();
  player.preload = 'metadata';
  player.volume = 0.6;

  let currentAlbum = null; // holds the album NAME (string) once opened
  let currentIndex = -1;
  let isSeeking = false;

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function coverFallback(name){
    return 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <rect fill="#0b0405" width="200" height="200"/>
        <text fill="#3d3535" font-family="Helvetica" font-size="14" font-weight="700"
          text-anchor="middle" x="100" y="104" letter-spacing="2">${name}</text>
      </svg>`
    );
  }

  // ---------------- intro ----------------

  function randomEntranceFile(){
    return entranceMP3s[Math.floor(Math.random() * entranceMP3s.length)];
  }

  function fadeOutAndStop(audio, duration){
    if (!audio || audio.paused) return;
    if (fadeTimer) clearInterval(fadeTimer);
    const start = audio.volume;
    const t0 = Date.now();
    fadeTimer = setInterval(() => {
      const p = Math.min((Date.now() - t0) / duration, 1);
      audio.volume = start * (1 - p);
      if (p >= 1){
        clearInterval(fadeTimer);
        fadeTimer = null;
        audio.pause();
        audio.currentTime = 0;
      }
    }, 50);
  }

  function playEntranceSound(){
    entranceAudio = new Audio(randomEntranceFile());
    entranceAudio.volume = 0.5;
    entranceAudio.play().then(() => {
      setTimeout(() => fadeOutAndStop(entranceAudio, 2500), 1800);
    }).catch(() => {
      audioNote.classList.add('show');
      setTimeout(() => audioNote.classList.remove('show'), 3500);
    });
  }

  function revealArchive(){
    playEntranceSound();
    intro.classList.add('hidden');
    setTimeout(() => main.classList.add('active'), 150);
    if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([15, 40, 15]);
  }

  enterBtn.addEventListener('click', (e) => { e.stopPropagation(); revealArchive(); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !intro.classList.contains('hidden') && document.activeElement !== enterBtn){
      revealArchive();
    }
  });

  // ---------------- album browsing ----------------

  function renderAlbums(){
    albumsGrid.innerHTML = '';
    if (!albums.length){
      albumsGrid.innerHTML = '<div class="empty-state">No releases catalogued yet.</div>';
      return;
    }

    albums.forEach(record => {
      const card = document.createElement('div');
      card.className = 'album-card';
      card.dataset.name = record.name;
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', `Open ${record.name}`);
      card.innerHTML = `
        <img class="album-cover" src="${record.cover}" alt="" loading="lazy"
             onerror="this.onerror=null;this.src='${coverFallback(record.name)}'">
        <div class="album-name">${record.name}</div>
        <div class="album-meta">${record.tracks.length} track${record.tracks.length === 1 ? '' : 's'}</div>
      `;
      card.addEventListener('click', () => openAlbum(record.name));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openAlbum(record.name); } });
      albumsGrid.appendChild(card);
    });
  }

  function openAlbum(albumName){
    const record = albumState[albumName];
    if (!record) return;

    currentAlbum = albumName;
    currentIndex = -1;

    albumsSection.classList.replace('visible-section','hidden-section');
    tracklistSection.classList.replace('hidden-section','visible-section');
    backButton.classList.add('visible');
    topBarTitle.textContent = record.name;
    window.scrollTo(0,0);

    renderTracklistBody(record);
  }

  function renderTracklistBody(record){
    tracklistContent.innerHTML = `
      <div class="tracklist-header">
        <img class="tracklist-cover" src="${record.cover}" alt=""
             onerror="this.onerror=null;this.src='${coverFallback(record.name)}'">
        <div class="tracklist-info">
          <h2>${record.name}</h2>
          <p>${record.tracks.length} tracks</p>
          <button class="play-all-btn" id="playAllBtn">▶ Play all</button>
        </div>
      </div>
      <div class="track-items" id="trackItems"></div>
    `;

    const trackItems = document.getElementById('trackItems');
    record.tracks.forEach((track, index) => {
      const row = document.createElement('div');
      row.className = 'track-item';
      row.dataset.index = index;
      row.tabIndex = 0;
      row.setAttribute('role','button');
      row.setAttribute('aria-label', `Play ${track.name}`);
      row.innerHTML = `
        <span class="track-number">${String(index + 1).padStart(2,'0')}</span>
        <span class="track-title">${track.name}</span>
        <span class="track-status">▶</span>
      `;
      row.addEventListener('click', () => loadAndPlay(index));
      row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); loadAndPlay(index); } });
      trackItems.appendChild(row);
    });

    document.getElementById('playAllBtn').addEventListener('click', () => loadAndPlay(0));
    refreshTrackHighlight();
  }

  backButton.addEventListener('click', () => {
    tracklistSection.classList.replace('visible-section','hidden-section');
    albumsSection.classList.replace('hidden-section','visible-section');
    backButton.classList.remove('visible');
    topBarTitle.textContent = 'Archive';
  });

  // ---------------- playback ----------------

  function refreshTrackHighlight(){
    document.querySelectorAll('.track-item').forEach(item => {
      const idx = Number(item.dataset.index);
      const isPlaying = currentAlbum && idx === currentIndex;
      item.classList.toggle('playing', !!isPlaying);
      const status = item.querySelector('.track-status');
      if (!status) return;
      if (item.classList.contains('errored')) return;
      status.innerHTML = isPlaying
        ? '<span class="eq"><span></span><span></span><span></span></span>'
        : '▶';
    });
  }

  function getCurrentRecord(){
    return currentAlbum ? albumState[currentAlbum] : null;
  }

  function loadAndPlay(index){
    const record = getCurrentRecord();
    if (!record) return;
    const track = record.tracks[index];
    if (!track) return;
    currentIndex = index;

    player.src = encodeURI(track.file);
    player.currentTime = 0;
    player.play().catch(() => {
      const row = document.querySelector(`.track-item[data-index="${index}"]`);
      if (row){
        row.classList.add('errored');
        const status = row.querySelector('.track-status');
        if (status) status.textContent = '✕ unavailable';
      }
    });

    playerTrackTitle.textContent = track.name;
    playerAlbumName.textContent = record.name;
    playerBar.classList.add('show');
    refreshTrackHighlight();
  }

  function setPlayIcon(playing){
    playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    playToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  playToggle.addEventListener('click', () => {
    if (!player.src) return;
    if (player.paused) player.play().catch(()=>{});
    else player.pause();
  });

  prevBtn.addEventListener('click', () => {
    if (currentIndex <= 0) return;
    loadAndPlay(currentIndex - 1);
  });
  nextBtn.addEventListener('click', () => {
    const record = getCurrentRecord();
    if (!record || currentIndex >= record.tracks.length - 1) return;
    loadAndPlay(currentIndex + 1);
  });

  player.addEventListener('play', () => setPlayIcon(true));
  player.addEventListener('pause', () => setPlayIcon(false));

  player.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressTrack.setAttribute('aria-valuenow', Math.round(pct));
    timeCurrent.textContent = fmtTime(player.currentTime);
  });

  player.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = fmtTime(player.duration);
  });

  player.addEventListener('ended', () => {
    const record = getCurrentRecord();
    if (record && currentIndex < record.tracks.length - 1){
      loadAndPlay(currentIndex + 1);
    } else {
      currentIndex = -1;
      refreshTrackHighlight();
    }
  });

  player.addEventListener('error', () => {
    const row = document.querySelector(`.track-item[data-index="${currentIndex}"]`);
    if (row){
      row.classList.add('errored');
      const status = row.querySelector('.track-status');
      if (status) status.textContent = '✕ unavailable';
    }
  });

  // seek
  function seekTo(clientX){
    const rect = progressTrack.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    if (player.duration) player.currentTime = pct * player.duration;
    progressFill.style.width = (pct * 100) + '%';
  }
  progressTrack.addEventListener('click', (e) => seekTo(e.clientX));
  progressTrack.addEventListener('keydown', (e) => {
    if (!player.duration) return;
    if (e.key === 'ArrowRight'){ player.currentTime = Math.min(player.duration, player.currentTime + 5); }
    if (e.key === 'ArrowLeft'){ player.currentTime = Math.max(0, player.currentTime - 5); }
  });
  let dragging = false;
  progressTrack.addEventListener('pointerdown', (e) => { dragging = true; isSeeking = true; seekTo(e.clientX); });
  window.addEventListener('pointermove', (e) => { if (dragging) seekTo(e.clientX); });
  window.addEventListener('pointerup', () => { dragging = false; isSeeking = false; });

  // volume
  function setVolume(clientX){
    const rect = volumeTrack.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    player.volume = pct;
    volumeFill.style.width = (pct * 100) + '%';
    volumeTrack.setAttribute('aria-valuenow', Math.round(pct * 100));
  }
  volumeTrack.addEventListener('click', (e) => setVolume(e.clientX));
  volumeTrack.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight'){ player.volume = Math.min(1, player.volume + 0.1); volumeFill.style.width = (player.volume*100)+'%'; }
    if (e.key === 'ArrowLeft'){ player.volume = Math.max(0, player.volume - 0.1); volumeFill.style.width = (player.volume*100)+'%'; }
  });
  volumeFill.style.width = (player.volume * 100) + '%';

  renderAlbums();
})();
</script>
</body>
</html>
